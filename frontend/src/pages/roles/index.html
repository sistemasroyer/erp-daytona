<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles y Permisos — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="container-fluid p-4">
    <div class="row g-3">
      <!-- Lista de roles -->
      <div class="col-lg-4">
        <div class="card h-100">
          <div class="card-header d-flex justify-content-between align-items-center fw-semibold">
            <span><i class="bi bi-shield-check me-2"></i>Roles</span>
            <button class="btn btn-sm btn-outline-primary" id="btn-nuevo-rol"><i class="bi bi-plus-lg"></i></button>
          </div>
          <div class="list-group list-group-flush" id="lista-roles">
            <div class="list-group-item text-center py-4 text-muted">Cargando...</div>
          </div>
        </div>
      </div>

      <!-- Permisos del rol seleccionado -->
      <div class="col-lg-8">
        <div class="card h-100">
          <div class="card-header fw-semibold">
            <i class="bi bi-key me-2"></i>Permisos del rol: <span id="nombre-rol-sel" class="text-primary">— seleccione un rol —</span>
          </div>
          <div class="card-body" id="panel-permisos">
            <div class="text-center text-muted py-4">
              <i class="bi bi-arrow-left-circle fs-2"></i><br>Seleccione un rol para ver sus permisos
            </div>
          </div>
          <div class="card-footer d-none" id="footer-permisos">
            <button class="btn btn-primary" id="btn-guardar-permisos">
              <i class="bi bi-save me-1"></i>Guardar permisos
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal crear/editar rol -->
  <div class="modal fade" id="modal-rol" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-rol-titulo">Nuevo Rol</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="rol-nombre">
          </div>
          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" id="rol-desc" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="btn-guardar-rol">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { api } from '/src/api/client.js';
    import { rolesApi, permisosApi } from '/src/api/modules.js';
    import { toast, toastError } from '/src/components/toast.js';
    import { logout } from '/src/auth/auth.js';

    if (!api.getToken()) window.location.href = '/src/pages/login.html';
    initLayout('roles');
    document.getElementById('btn-logout').addEventListener('click', () => logout());

    let roles = [], todosPermisos = [], rolSeleccionado = null, rolEditando = null;

    async function init() {
      try {
        const [rolesRes, permsRes] = await Promise.all([rolesApi.listar(), permisosApi.listar()]);
        roles = Array.isArray(rolesRes.data) ? rolesRes.data : rolesRes.data?.roles || [];
        todosPermisos = Array.isArray(permsRes.data) ? permsRes.data : permsRes.data?.permisos || [];
        renderRoles();
      } catch (err) { toastError(err); }
    }

    function renderRoles() {
      const lista = document.getElementById('lista-roles');
      lista.innerHTML = roles.length ? roles.map((r) => `
        <button type="button" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center ${rolSeleccionado?.id === r.id ? 'active' : ''}" data-id="${r.id}">
          <div>
            <div class="fw-semibold">${r.nombre}</div>
            <div class="small text-muted">${r.descripcion || ''}</div>
          </div>
          <button class="btn btn-sm btn-outline-secondary btn-edit-rol" data-id="${r.id}" data-nombre="${r.nombre}" data-desc="${r.descripcion || ''}" onclick="event.stopPropagation()">
            <i class="bi bi-pencil"></i>
          </button>
        </button>`).join('') : '<div class="list-group-item text-center text-muted">Sin roles</div>';

      lista.querySelectorAll('[data-id].list-group-item').forEach((btn) => {
        btn.addEventListener('click', () => seleccionarRol(btn.dataset.id));
      });
      lista.querySelectorAll('.btn-edit-rol').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          abrirEditarRol({ id: btn.dataset.id, nombre: btn.dataset.nombre, descripcion: btn.dataset.desc });
        });
      });
    }

    async function seleccionarRol(id) {
      try {
        const res = await rolesApi.obtener(id);
        rolSeleccionado = res.data || res;
        document.getElementById('nombre-rol-sel').textContent = rolSeleccionado.nombre;
        renderPermisos();
        renderRoles();
      } catch (err) { toastError(err); }
    }

    function renderPermisos() {
      const panel = document.getElementById('panel-permisos');
      const permisosRol = rolSeleccionado.permisos?.map((p) => p.id_permiso) || [];

      // Agrupar permisos por módulo
      const porModulo = {};
      todosPermisos.forEach((p) => {
        if (!porModulo[p.modulo]) porModulo[p.modulo] = [];
        porModulo[p.modulo].push(p);
      });

      const acciones = ['ver', 'crear', 'editar', 'eliminar', 'aprobar', 'anular'];

      panel.innerHTML = Object.entries(porModulo).map(([modulo, perms]) => `
        <div class="mb-3">
          <div class="d-flex align-items-center mb-2">
            <h6 class="mb-0 me-2 text-capitalize fw-bold">${modulo.replace(/_/g, ' ')}</h6>
            <button type="button" class="btn btn-sm btn-link p-0 btn-toggle-all" data-modulo="${modulo}">Todos</button>
          </div>
          <div class="d-flex flex-wrap gap-2">
            ${acciones.map((acc) => {
              const perm = perms.find((p) => p.accion === acc || p.submodulo === acc);
              if (!perm) return '';
              const checked = permisosRol.includes(perm.id);
              return `
              <div class="form-check form-check-inline border rounded px-2 py-1">
                <input class="form-check-input perm-check" type="checkbox" id="perm-${perm.id}" value="${perm.id}" ${checked ? 'checked' : ''}>
                <label class="form-check-label small" for="perm-${perm.id}">${acc}</label>
              </div>`;
            }).join('')}
          </div>
        </div>`).join('');

      panel.querySelectorAll('.btn-toggle-all').forEach((btn) => {
        btn.addEventListener('click', () => {
          const checks = btn.closest('.mb-3').querySelectorAll('.perm-check');
          const allChecked = [...checks].every((c) => c.checked);
          checks.forEach((c) => { c.checked = !allChecked; });
        });
      });

      document.getElementById('footer-permisos').classList.remove('d-none');
    }

    document.getElementById('btn-guardar-permisos').addEventListener('click', async () => {
      if (!rolSeleccionado) return;
      const seleccionados = [...document.querySelectorAll('.perm-check:checked')].map((inp) => inp.value);
      try {
        await rolesApi.asignarPermisos(rolSeleccionado.id, seleccionados);
        toast('Permisos actualizados correctamente');
        seleccionarRol(rolSeleccionado.id);
      } catch (err) { toastError(err); }
    });

    // Crear/editar rol
    document.getElementById('btn-nuevo-rol').addEventListener('click', () => {
      rolEditando = null;
      document.getElementById('modal-rol-titulo').textContent = 'Nuevo Rol';
      document.getElementById('rol-nombre').value = '';
      document.getElementById('rol-desc').value = '';
      new bootstrap.Modal(document.getElementById('modal-rol')).show();
    });

    function abrirEditarRol(rol) {
      rolEditando = rol;
      document.getElementById('modal-rol-titulo').textContent = 'Editar Rol';
      document.getElementById('rol-nombre').value = rol.nombre;
      document.getElementById('rol-desc').value = rol.descripcion || '';
      new bootstrap.Modal(document.getElementById('modal-rol')).show();
    }

    document.getElementById('btn-guardar-rol').addEventListener('click', async () => {
      const nombre = document.getElementById('rol-nombre').value.trim();
      if (!nombre) { toast('Ingrese el nombre del rol', 'warning'); return; }
      const dto = { nombre, descripcion: document.getElementById('rol-desc').value.trim() || undefined };
      try {
        if (rolEditando) await rolesApi.actualizar(rolEditando.id, dto);
        else await rolesApi.crear(dto);
        toast(rolEditando ? 'Rol actualizado' : 'Rol creado');
        bootstrap.Modal.getInstance(document.getElementById('modal-rol')).hide();
        init();
      } catch (err) { toastError(err); }
    });

    init();
  </script>
</body>
</html>
