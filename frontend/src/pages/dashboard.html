<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="mb-0 fw-bold">Dashboard</h4>
        <p class="text-muted mb-0 small">Resumen general del negocio</p>
      </div>
      <button class="btn btn-outline-primary btn-sm" id="btn-refresh">
        <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
      </button>
    </div>

    <!-- Métricas -->
    <div class="row g-3 mb-4" id="metricas">
      <div class="col-sm-6 col-xl-3">
        <div class="card metric-card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="bg-primary bg-opacity-10 rounded-3 p-3">
              <i class="bi bi-receipt fs-3 text-primary"></i>
            </div>
            <div>
              <div class="text-muted small">Ventas hoy</div>
              <div class="fw-bold fs-4" id="m-ventas-hoy">—</div>
              <div class="text-muted small" id="m-ventas-count">— comprobantes</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card metric-card h-100" style="border-left-color:#198754">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="bg-success bg-opacity-10 rounded-3 p-3">
              <i class="bi bi-cart-check fs-3 text-success"></i>
            </div>
            <div>
              <div class="text-muted small">Compras hoy</div>
              <div class="fw-bold fs-4" id="m-compras-hoy">—</div>
              <div class="text-muted small" id="m-compras-count">— documentos</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card metric-card h-100" style="border-left-color:#fd7e14">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="bg-warning bg-opacity-10 rounded-3 p-3">
              <i class="bi bi-exclamation-triangle fs-3 text-warning"></i>
            </div>
            <div>
              <div class="text-muted small">Stock crítico</div>
              <div class="fw-bold fs-4" id="m-stock-critico">—</div>
              <div class="text-muted small">productos</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="card metric-card h-100" style="border-left-color:#6f42c1">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="rounded-3 p-3" style="background:rgba(111,66,193,0.1)">
              <i class="bi bi-people fs-3" style="color:#6f42c1"></i>
            </div>
            <div>
              <div class="text-muted small">Órdenes pendientes</div>
              <div class="fw-bold fs-4" id="m-ordenes-pendientes">—</div>
              <div class="text-muted small">por aprobar</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <!-- Últimas ventas -->
      <div class="col-lg-7">
        <div class="card h-100">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-semibold"><i class="bi bi-receipt me-2 text-primary"></i>Últimas ventas</h6>
            <a href="ventas/index.html" class="btn btn-sm btn-outline-primary">Ver todas</a>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-sm table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Comprobante</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Estado</th>
                  </tr>
                </thead>
                <tbody id="tabla-ultimas-ventas">
                  <tr><td colspan="4" class="text-center text-muted py-3">Cargando...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Alertas de stock -->
      <div class="col-lg-5">
        <div class="card h-100">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h6 class="mb-0 fw-semibold"><i class="bi bi-exclamation-diamond me-2 text-warning"></i>Alertas de stock</h6>
            <a href="inventario/index.html" class="btn btn-sm btn-outline-warning">Ver inventario</a>
          </div>
          <div class="card-body p-0">
            <div class="list-group list-group-flush" id="lista-alertas-stock">
              <div class="list-group-item text-center text-muted py-3">Cargando...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { api } from '/src/api/client.js';
    import { ventasApi, comprasApi, productosApi, ordenesApi } from '/src/api/modules.js';
    import { formatMoneda, badgeEstado } from '/src/components/tabla.js';

    if (!api.getToken()) { window.location.href = '/src/pages/login.html'; }
    initLayout('dashboard');

    async function cargarDashboard() {
      const hoy = new Date().toISOString().split('T')[0];

      const [ventas, compras, alertas, ordenes] = await Promise.allSettled([
        ventasApi.listar({ fecha_desde: hoy, fecha_hasta: hoy, limit: 10 }),
        comprasApi.listar({ fecha_desde: hoy, fecha_hasta: hoy }),
        productosApi.alertasStock(),
        ordenesApi.listar({ estado: 'borrador', limit: 5 }),
      ]);

      if (ventas.status === 'fulfilled') {
        const data = ventas.value.data;
        const total = data.reduce((s, v) => s + Number(v.total), 0);
        document.getElementById('m-ventas-hoy').textContent = formatMoneda(total);
        document.getElementById('m-ventas-count').textContent = `${data.length} comprobantes`;
        document.getElementById('tabla-ultimas-ventas').innerHTML = data.length
          ? data.slice(0, 8).map((v) => `
              <tr>
                <td class="small fw-semibold">${v.numero_comprobante || `${v.serie}-${v.correlativo}`}</td>
                <td class="small">${v.cliente?.razon_social || '-'}</td>
                <td class="small">${formatMoneda(v.total)}</td>
                <td>${badgeEstado(v.estado_sunat)}</td>
              </tr>`).join('')
          : '<tr><td colspan="4" class="text-center text-muted py-3">Sin ventas hoy</td></tr>';
      }

      if (compras.status === 'fulfilled') {
        const data = compras.value.data || compras.value;
        const arr = Array.isArray(data) ? data : data.data || [];
        const total = arr.reduce((s, c) => s + Number(c.total), 0);
        document.getElementById('m-compras-hoy').textContent = formatMoneda(total);
        document.getElementById('m-compras-count').textContent = `${arr.length} documentos`;
      }

      if (alertas.status === 'fulfilled') {
        const arr = Array.isArray(alertas.value.data) ? alertas.value.data : [];
        document.getElementById('m-stock-critico').textContent = arr.length;
        document.getElementById('lista-alertas-stock').innerHTML = arr.length
          ? arr.slice(0, 6).map((p) => `
              <div class="list-group-item d-flex justify-content-between align-items-center py-2">
                <div>
                  <div class="small fw-semibold">${p.nombre}</div>
                  <div class="text-muted" style="font-size:.75rem">${p.codigo}</div>
                </div>
                <span class="badge ${Number(p.stock_actual) <= 0 ? 'bg-danger' : 'bg-warning text-dark'}">
                  ${Number(p.stock_actual).toFixed(2)}
                </span>
              </div>`).join('')
          : '<div class="list-group-item text-center text-success py-3"><i class="bi bi-check-circle me-2"></i>Sin alertas</div>';
      }

      if (ordenes.status === 'fulfilled') {
        const data = ordenes.value.data || ordenes.value;
        const arr = Array.isArray(data) ? data : data.data || [];
        document.getElementById('m-ordenes-pendientes').textContent = arr.length;
      }
    }

    cargarDashboard();
    document.getElementById('btn-refresh').addEventListener('click', cargarDashboard);
  </script>
</body>
</html>
