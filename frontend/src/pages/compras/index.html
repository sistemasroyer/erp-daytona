<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compras — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0"><i class="bi bi-cart me-2 text-primary"></i>Registro de Compras</h5>
      <a href="/src/pages/compras/nueva.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nueva Compra</a>
    </div>

    <div class="card mb-3">
      <div class="card-body py-2">
        <div class="row g-2 align-items-end">
          <div class="col-sm-3">
            <input type="date" class="form-control form-control-sm" id="f-desde">
          </div>
          <div class="col-sm-3">
            <input type="date" class="form-control form-control-sm" id="f-hasta">
          </div>
          <div class="col-sm-2">
            <select class="form-select form-select-sm" id="f-estado">
              <option value="">Todos</option>
              <option value="borrador">Borrador</option>
              <option value="registrada">Registrada</option>
              <option value="anulada">Anulada</option>
            </select>
          </div>
          <div class="col-sm-2">
            <button class="btn btn-primary btn-sm w-100" id="btn-filtrar"><i class="bi bi-funnel me-1"></i>Filtrar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-sm mb-0">
            <thead class="table-light">
              <tr>
                <th>N° Documento</th>
                <th>Tipo</th>
                <th>Fecha</th>
                <th>Proveedor</th>
                <th>Almacén</th>
                <th class="text-center">Condición</th>
                <th class="text-end">Total</th>
                <th class="text-center">Moneda</th>
                <th class="text-center">Estado</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-compras">
              <tr><td colspan="10" class="text-center py-4 text-muted">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer d-flex justify-content-between">
        <span class="text-muted small" id="info-res">-</span>
        <div id="paginacion"></div>
      </div>
    </div>
  </div>

  <!-- Modal detalle -->
  <div class="modal fade" id="modal-detalle" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detalle de Compra</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modal-body">Cargando...</div>
        <div class="modal-footer">
          <button class="btn btn-success d-none" id="btn-pagar-flete"><i class="bi bi-truck me-1"></i>Registrar pago de flete</button>
          <button class="btn btn-danger d-none" id="btn-anular"><i class="bi bi-x-circle me-1"></i>Anular</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal pagar flete -->
  <div class="modal fade" id="modal-pagar-flete" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title"><i class="bi bi-truck me-2"></i>Registrar pago de flete</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-info py-2 small" id="pf-info"></div>
          <div class="mb-3">
            <label class="form-label">Método de pago <span class="text-danger">*</span></label>
            <select class="form-select" id="pf-metodo-pago">
              <option value="">Cargando...</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Referencia (opcional)</label>
            <input type="text" class="form-control" id="pf-referencia" placeholder="N° operación, voucher, etc.">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-success" id="btn-confirmar-pago-flete"><i class="bi bi-check-lg me-1"></i>Confirmar Pago</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { api } from '/src/api/client.js';
    import { comprasApi, metodosPagoApi } from '/src/api/modules.js';
    import { formatMoneda, formatFecha, badgeEstado, renderPaginacion } from '/src/components/tabla.js';
    import { toast, toastError } from '/src/components/toast.js';
    import { confirmar } from '/src/components/modal.js';
    import { logout } from '/src/auth/auth.js';

    if (!api.getToken()) window.location.href = '/src/pages/login.html';
    initLayout('compras');
    document.getElementById('btn-logout').addEventListener('click', () => logout());

    const hoy = new Date();
    const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().split('T')[0];
    document.getElementById('f-desde').value = primerDia;
    document.getElementById('f-hasta').value = hoy.toISOString().split('T')[0];

    let paginaActual = 1, compraActual = null;
    const LIMIT = 20;

    async function cargar(page = 1) {
      paginaActual = page;
      const tbody = document.getElementById('tabla-compras');
      tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4"><span class="spinner-border spinner-border-sm"></span></td></tr>';
      try {
        const res = await comprasApi.listar({
          fecha_desde: document.getElementById('f-desde').value || undefined,
          fecha_hasta: document.getElementById('f-hasta').value || undefined,
          estado: document.getElementById('f-estado').value || undefined,
          page, limit: LIMIT,
        });
        const items = Array.isArray(res.data) ? res.data : res.data?.compras || [];
        const total = res.data?.total ?? items.length;
        document.getElementById('info-res').textContent = `${total} registros`;

        tbody.innerHTML = items.length ? items.map((c) => `
          <tr style="cursor:pointer" data-id="${c.id}">
            <td class="fw-semibold small">${c.serie ? `${c.serie}-${c.numero}` : c.numero || '-'}</td>
            <td><span class="badge bg-secondary">${c.tipo_documento}</span></td>
            <td>${formatFecha(c.fecha_emision)}</td>
            <td>${c.proveedor?.razon_social || '-'}</td>
            <td class="small">${c.almacen?.nombre || '-'}</td>
            <td class="text-center">${c.condicion_pago === 'credito' ? `<span class="badge bg-warning text-dark" title="Vence: ${c.fecha_vencimiento ? formatFecha(c.fecha_vencimiento) : '-'}">Crédito</span>` : '<span class="badge bg-success">Contado</span>'}</td>
            <td class="text-end fw-semibold">${formatMoneda(c.total, c.moneda)}</td>
            <td class="text-center"><span class="badge bg-light text-dark border">${c.moneda}</span></td>
            <td class="text-center">${badgeEstado(c.estado)}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary btn-ver" data-id="${c.id}"><i class="bi bi-eye"></i></button>
            </td>
          </tr>`).join('') : '<tr><td colspan="10" class="text-center text-muted py-4">Sin resultados</td></tr>';

        renderPaginacion(document.getElementById('paginacion'), { page, total, limit: LIMIT }, cargar);
        tbody.querySelectorAll('.btn-ver').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); abrirDetalle(b.dataset.id); }));
        tbody.querySelectorAll('tr[data-id]').forEach((tr) => tr.addEventListener('click', () => abrirDetalle(tr.dataset.id)));
      } catch (err) { toastError(err); }
    }

    async function abrirDetalle(id) {
      const modal = new bootstrap.Modal(document.getElementById('modal-detalle'));
      document.getElementById('modal-body').innerHTML = '<div class="text-center py-4"><span class="spinner-border"></span></div>';
      document.getElementById('btn-anular').classList.add('d-none');
      document.getElementById('btn-pagar-flete').classList.add('d-none');
      modal.show();
      try {
        const res = await comprasApi.obtener(id);
        const c = res.data || res;
        compraActual = c;
        const detalles = c.detalle || c.detalle_compras || c.detalles || [];

        document.getElementById('modal-body').innerHTML = `
          <div class="row mb-3">
            <div class="col-md-6">
              <table class="table table-sm table-borderless">
                <tr><th class="text-muted">Documento</th><td class="fw-bold">${c.tipo_documento} ${c.serie ? c.serie + '-' + c.numero : c.numero}</td></tr>
                <tr><th class="text-muted">Fecha</th><td>${formatFecha(c.fecha_emision)}</td></tr>
                <tr><th class="text-muted">Moneda</th><td>${c.moneda}</td></tr>
                <tr><th class="text-muted">Condición de pago</th><td>${c.condicion_pago === 'credito' ? `Crédito${c.fecha_vencimiento ? ` (vence ${formatFecha(c.fecha_vencimiento)})` : ''}` : 'Contado'}</td></tr>
                <tr><th class="text-muted">Estado</th><td>${badgeEstado(c.estado)}</td></tr>
              </table>
            </div>
            <div class="col-md-6">
              <table class="table table-sm table-borderless">
                <tr><th class="text-muted">Proveedor</th><td>${c.proveedor?.razon_social || '-'}</td></tr>
                <tr><th class="text-muted">RUC</th><td>${c.proveedor?.ruc || '-'}</td></tr>
                <tr><th class="text-muted">Almacén</th><td>${c.almacen?.nombre || '-'}</td></tr>
                ${c.observaciones ? `<tr><th class="text-muted">Observaciones</th><td>${c.observaciones}</td></tr>` : ''}
              </table>
            </div>
          </div>
          <h6 class="fw-semibold mb-2"><i class="bi bi-receipt me-1"></i>Detalle de la factura (tal como la emitió el proveedor)</h6>
          <div class="table-responsive">
            <table class="table table-sm table-striped">
              <thead class="table-dark">
                <tr>
                  <th>Producto</th>
                  <th class="text-end">Cantidad</th>
                  <th class="text-end">Precio Unitario</th>
                  <th class="text-end">Subtotal</th>
                  <th class="text-end">IGV</th>
                  <th class="text-end">Total</th>
                </tr>
              </thead>
              <tbody>
                ${detalles.map((d) => `
                <tr>
                  <td>${d.producto?.nombre || d.id_producto}</td>
                  <td class="text-end">${Number(d.cantidad).toFixed(4)}</td>
                  <td class="text-end">${formatMoneda(d.precio_unitario, c.moneda)}</td>
                  <td class="text-end">${formatMoneda(d.subtotal, c.moneda)}</td>
                  <td class="text-end">${formatMoneda(d.igv, c.moneda)}</td>
                  <td class="text-end fw-semibold">${formatMoneda(d.total, c.moneda)}</td>
                </tr>`).join('')}
              </tbody>
              <tfoot class="table-light fw-bold">
                <tr><td colspan="3" class="text-end">Subtotal:</td><td colspan="3" class="text-end">${formatMoneda(c.subtotal, c.moneda)}</td></tr>
                <tr><td colspan="3" class="text-end">IGV:</td><td colspan="3" class="text-end">${formatMoneda(c.igv, c.moneda)}</td></tr>
                <tr class="table-primary"><td colspan="3" class="text-end fs-6">TOTAL A PAGAR AL PROVEEDOR:</td><td colspan="3" class="text-end fs-6">${formatMoneda(c.total, c.moneda)}</td></tr>
              </tfoot>
            </table>
          </div>
          ${c.flete_monto > 0 ? `
          <div class="d-flex justify-content-between align-items-center bg-light rounded p-3 mt-2">
            <div>
              <div class="fw-semibold"><i class="bi bi-truck me-1"></i>Flete (gasto aparte, no incluido en el total de arriba)</div>
              <div class="small text-muted">
                ${formatMoneda(c.flete_monto, c.flete_moneda)}
                ${c.proveedor_flete ? ` · Transportista: ${c.proveedor_flete.razon_social}` : ''}
              </div>
            </div>
            <div class="text-end">
              ${c.flete_pagado
                ? `<span class="badge bg-success">Pagado${c.metodo_pago_flete ? ` (${c.metodo_pago_flete.nombre})` : ''}</span>
                   ${c.flete_fecha_pago ? `<div class="small text-muted mt-1">${formatFecha(c.flete_fecha_pago)}</div>` : ''}`
                : '<span class="badge bg-warning text-dark">Pendiente de pago</span>'}
            </div>
          </div>` : ''}

          <h6 class="fw-semibold mt-4 mb-2"><i class="bi bi-boxes me-1"></i>Costeo de inventario</h6>
          <div class="alert alert-secondary py-2 px-3 small mb-2">
            <i class="bi bi-info-circle me-1"></i>Este cálculo es independiente de la factura del proveedor: toma el costo unitario de la factura y le suma el flete prorrateado (si aplica) para obtener el costo real con el que se valoriza el inventario.
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-bordered">
              <thead class="table-light">
                <tr>
                  <th>Producto</th>
                  <th class="text-end">Costo Base s/IGV (factura)</th>
                  <th class="text-end">Flete Prorrateado</th>
                  <th class="text-end">Costo Final s/IGV</th>
                  <th class="text-end">Costo Final c/IGV</th>
                </tr>
              </thead>
              <tbody>
                ${detalles.map((d) => {
                  const costoBaseSinIgv = Number(d.cantidad) > 0 ? Number(d.subtotal) / Number(d.cantidad) : 0;
                  const costoFinalSinIgv = Number(d.costo_unitario_total || 0);
                  const costoFinalConIgv = d.afecta_igv ? costoFinalSinIgv * 1.18 : costoFinalSinIgv;
                  return `
                <tr>
                  <td>${d.producto?.nombre || d.id_producto}</td>
                  <td class="text-end">${formatMoneda(costoBaseSinIgv)}</td>
                  <td class="text-end text-muted">${formatMoneda(d.costo_flete_prorrateado || 0)}</td>
                  <td class="text-end fw-semibold">${formatMoneda(costoFinalSinIgv)}</td>
                  <td class="text-end fw-semibold">${formatMoneda(costoFinalConIgv)}</td>
                </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>`;

        if (c.estado === 'registrada') {
          document.getElementById('btn-anular').classList.remove('d-none');
        }
        if (c.estado === 'registrada' && c.flete_monto > 0 && !c.flete_pagado) {
          document.getElementById('btn-pagar-flete').classList.remove('d-none');
        }
      } catch (err) {
        document.getElementById('modal-body').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    document.getElementById('btn-anular').addEventListener('click', async () => {
      if (!compraActual) return;
      const ok = await confirmar(`¿Anular la compra ${compraActual.numero}?`, 'Anular Compra');
      if (!ok) return;
      const motivo = prompt('Motivo de anulación (requerido):');
      if (!motivo?.trim()) { toast('Ingrese un motivo de anulación', 'warning'); return; }
      try {
        await comprasApi.anular(compraActual.id, motivo.trim());
        toast('Compra anulada');
        bootstrap.Modal.getInstance(document.getElementById('modal-detalle')).hide();
        cargar(paginaActual);
      } catch (err) { toastError(err); }
    });

    // ── Pagar flete ──────────────────────────────────────────────────────────────
    document.getElementById('btn-pagar-flete').addEventListener('click', async () => {
      if (!compraActual) return;
      document.getElementById('pf-info').innerHTML =
        `Flete de <strong>${formatMoneda(compraActual.flete_monto, compraActual.flete_moneda)}</strong>` +
        (compraActual.proveedor_flete ? ` a <strong>${compraActual.proveedor_flete.razon_social}</strong>` : '') +
        ` — Compra ${compraActual.numero}`;
      document.getElementById('pf-referencia').value = '';

      const selMetodo = document.getElementById('pf-metodo-pago');
      selMetodo.innerHTML = '<option value="">Cargando...</option>';
      try {
        const res = await metodosPagoApi.listar();
        const metodos = res.data || [];
        selMetodo.innerHTML = metodos.length
          ? metodos.map((m) => `<option value="${m.id}">${m.nombre}</option>`).join('')
          : '<option value="">Sin métodos de pago configurados</option>';
      } catch (err) { toastError(err); }

      new bootstrap.Modal(document.getElementById('modal-pagar-flete')).show();
    });

    document.getElementById('btn-confirmar-pago-flete').addEventListener('click', async () => {
      if (!compraActual) return;
      const idMetodo = document.getElementById('pf-metodo-pago').value;
      if (!idMetodo) { toast('Seleccione un método de pago', 'warning'); return; }

      const btn = document.getElementById('btn-confirmar-pago-flete');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Guardando...';

      try {
        await comprasApi.pagarFlete(compraActual.id, {
          id_metodo_pago: idMetodo,
          referencia: document.getElementById('pf-referencia').value.trim() || undefined,
        });
        toast('Pago de flete registrado');
        bootstrap.Modal.getInstance(document.getElementById('modal-pagar-flete')).hide();
        abrirDetalle(compraActual.id);
      } catch (err) {
        toastError(err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Confirmar Pago';
      }
    });

    document.getElementById('btn-filtrar').addEventListener('click', () => cargar(1));
    cargar();
  </script>
</body>
</html>
