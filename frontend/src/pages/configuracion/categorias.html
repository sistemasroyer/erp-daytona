<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0"><i class="bi bi-tags me-2 text-primary"></i>Categorias y Subcategorias</h5>
      <button class="btn btn-primary btn-sm" id="btn-nueva-cat"><i class="bi bi-plus-lg me-1"></i>Nueva Categoria</button>
    </div>

    <div class="row g-3">
      <!-- Categorias -->
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold bg-white d-flex justify-content-between align-items-center">
            <span><i class="bi bi-tags me-2 text-primary"></i>Categorias</span>
            <span class="badge bg-primary" id="badge-cats">0</span>
          </div>
          <div class="card-body p-0">
            <div id="lista-categorias" style="max-height:500px;overflow-y:auto">
              <div class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Cargando...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Subcategorias -->
      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold bg-white d-flex justify-content-between align-items-center">
            <span><i class="bi bi-diagram-3 me-2 text-secondary"></i>Subcategorias de: <strong id="cat-seleccionada">—</strong></span>
            <button class="btn btn-outline-secondary btn-sm" id="btn-nueva-subcat" disabled>
              <i class="bi bi-plus-lg me-1"></i>Nueva Subcategoria
            </button>
          </div>
          <div class="card-body p-0">
            <div id="lista-subcategorias" style="max-height:500px;overflow-y:auto">
              <div class="text-center py-5 text-muted">Selecciona una categoria para ver sus subcategorias</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Categoria -->
  <div class="modal fade" id="modalCategoria" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-cat-titulo">Nueva Categoria</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="cat-id">
          <div class="mb-3">
            <label class="form-label">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="cat-nombre" placeholder="Ej: Motores, Frenos...">
          </div>
          <div class="mb-3">
            <label class="form-label">Descripcion</label>
            <textarea class="form-control" id="cat-descripcion" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-guardar-cat">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Subcategoria -->
  <div class="modal fade" id="modalSubcategoria" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-subcat-titulo">Nueva Subcategoria</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="subcat-id">
          <div class="mb-3">
            <label class="form-label">Categoria: <strong id="subcat-cat-nombre"></strong></label>
          </div>
          <div class="mb-3">
            <label class="form-label">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="subcat-nombre" placeholder="Ej: Pistones, Pastillas...">
          </div>
          <div class="mb-3">
            <label class="form-label">Descripcion</label>
            <textarea class="form-control" id="subcat-descripcion" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-guardar-subcat">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { categoriasApi, subcategoriasApi } from '/src/api/modules.js';
    import { requirePermiso } from '/src/auth/auth.js';

    requirePermiso('productos:editar');
    initLayout('config-categorias');

    let categorias = [];
    let catSeleccionadaId = null;
    const modalCat = new bootstrap.Modal('#modalCategoria');
    const modalSubcat = new bootstrap.Modal('#modalSubcategoria');

    async function cargarCategorias() {
      const res = await categoriasApi.listar();
      categorias = Array.isArray(res.data) ? res.data : (res.data?.data || []);
      document.getElementById('badge-cats').textContent = categorias.length;
      const el = document.getElementById('lista-categorias');
      if (!categorias.length) {
        el.innerHTML = '<div class="text-center py-4 text-muted">Sin categorias registradas</div>';
        return;
      }
      el.innerHTML = categorias.map(c => `
        <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom cat-row ${c.id === catSeleccionadaId ? 'bg-primary bg-opacity-10' : ''}"
             style="cursor:pointer" data-id="${c.id}">
          <span class="fw-semibold">${c.nombre}</span>
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-primary btn-edit-cat" data-id="${c.id}" title="Editar">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger btn-del-cat" data-id="${c.id}" title="Eliminar">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>`).join('');

      el.querySelectorAll('.cat-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          selectCategoria(row.dataset.id);
        });
      });
      el.querySelectorAll('.btn-edit-cat').forEach(btn => {
        btn.addEventListener('click', () => editarCategoria(btn.dataset.id));
      });
      el.querySelectorAll('.btn-del-cat').forEach(btn => {
        btn.addEventListener('click', () => eliminarCategoria(btn.dataset.id));
      });
    }

    function selectCategoria(id) {
      catSeleccionadaId = id;
      const cat = categorias.find(c => c.id === id);
      document.getElementById('cat-seleccionada').textContent = cat?.nombre || '—';
      document.getElementById('btn-nueva-subcat').disabled = false;
      cargarCategorias();
      cargarSubcategorias(id);
    }

    async function cargarSubcategorias(idCategoria) {
      const res = await subcategoriasApi.porCategoria(idCategoria);
      const subs = Array.isArray(res.data) ? res.data : (res.data?.data || []);
      const el = document.getElementById('lista-subcategorias');
      if (!subs.length) {
        el.innerHTML = '<div class="text-center py-4 text-muted">Sin subcategorias</div>';
        return;
      }
      el.innerHTML = subs.map(s => `
        <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
          <span>${s.nombre}</span>
          <button class="btn btn-sm btn-outline-primary btn-edit-subcat" data-id="${s.id}"
                  data-nombre="${s.nombre}" data-desc="${s.descripcion || ''}">
            <i class="bi bi-pencil"></i>
          </button>
        </div>`).join('');

      el.querySelectorAll('.btn-edit-subcat').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('subcat-id').value = btn.dataset.id;
          document.getElementById('subcat-nombre').value = btn.dataset.nombre;
          document.getElementById('subcat-descripcion').value = btn.dataset.desc;
          document.getElementById('modal-subcat-titulo').textContent = 'Editar Subcategoria';
          document.getElementById('subcat-cat-nombre').textContent = categorias.find(c => c.id === catSeleccionadaId)?.nombre || '';
          modalSubcat.show();
        });
      });
    }

    function editarCategoria(id) {
      const cat = categorias.find(c => c.id === id);
      if (!cat) return;
      document.getElementById('cat-id').value = cat.id;
      document.getElementById('cat-nombre').value = cat.nombre;
      document.getElementById('cat-descripcion').value = cat.descripcion || '';
      document.getElementById('modal-cat-titulo').textContent = 'Editar Categoria';
      modalCat.show();
    }

    async function eliminarCategoria(id) {
      if (!confirm('¿Eliminar esta categoria? Se eliminaran sus subcategorias asociadas.')) return;
      try {
        await categoriasApi.eliminar(id);
        if (catSeleccionadaId === id) {
          catSeleccionadaId = null;
          document.getElementById('cat-seleccionada').textContent = '—';
          document.getElementById('btn-nueva-subcat').disabled = true;
          document.getElementById('lista-subcategorias').innerHTML = '<div class="text-center py-5 text-muted">Selecciona una categoria</div>';
        }
        cargarCategorias();
      } catch (e) {
        alert(e.message || 'Error al eliminar');
      }
    }

    document.getElementById('btn-nueva-cat').addEventListener('click', () => {
      document.getElementById('cat-id').value = '';
      document.getElementById('cat-nombre').value = '';
      document.getElementById('cat-descripcion').value = '';
      document.getElementById('modal-cat-titulo').textContent = 'Nueva Categoria';
      modalCat.show();
    });

    document.getElementById('btn-guardar-cat').addEventListener('click', async () => {
      const id = document.getElementById('cat-id').value;
      const nombre = document.getElementById('cat-nombre').value.trim();
      if (!nombre) { alert('El nombre es requerido'); return; }
      try {
        const data = { nombre, descripcion: document.getElementById('cat-descripcion').value.trim() || undefined };
        if (id) await categoriasApi.actualizar(id, data);
        else await categoriasApi.crear(data);
        modalCat.hide();
        cargarCategorias();
      } catch (e) {
        alert(e.message || 'Error al guardar');
      }
    });

    document.getElementById('btn-nueva-subcat').addEventListener('click', () => {
      document.getElementById('subcat-id').value = '';
      document.getElementById('subcat-nombre').value = '';
      document.getElementById('subcat-descripcion').value = '';
      document.getElementById('modal-subcat-titulo').textContent = 'Nueva Subcategoria';
      document.getElementById('subcat-cat-nombre').textContent = categorias.find(c => c.id === catSeleccionadaId)?.nombre || '';
      modalSubcat.show();
    });

    document.getElementById('btn-guardar-subcat').addEventListener('click', async () => {
      const id = document.getElementById('subcat-id').value;
      const nombre = document.getElementById('subcat-nombre').value.trim();
      if (!nombre) { alert('El nombre es requerido'); return; }
      try {
        const data = {
          id_categoria: catSeleccionadaId,
          nombre,
          descripcion: document.getElementById('subcat-descripcion').value.trim() || undefined,
        };
        if (id) await subcategoriasApi.actualizar(id, data);
        else await subcategoriasApi.crear(data);
        modalSubcat.hide();
        cargarSubcategorias(catSeleccionadaId);
      } catch (e) {
        alert(e.message || 'Error al guardar');
      }
    });

    cargarCategorias();
  </script>
</body>
</html>
