<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcas — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0"><i class="bi bi-bookmark me-2 text-primary"></i>Marcas</h5>
      <button class="btn btn-primary btn-sm" id="btn-nueva"><i class="bi bi-plus-lg me-1"></i>Nueva Marca</button>
    </div>

    <div class="card shadow-sm" style="max-width:600px">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <span class="fw-semibold">Listado de Marcas</span>
        <span class="badge bg-primary" id="badge-count">0</span>
      </div>
      <div class="card-body p-0">
        <div class="p-2 border-bottom">
          <input type="text" class="form-control form-control-sm" id="f-search" placeholder="Buscar marca...">
        </div>
        <div id="lista-marcas" style="max-height:500px;overflow-y:auto">
          <div class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Cargando...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="modalMarca" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-titulo">Nueva Marca</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="marca-id">
          <div class="mb-3">
            <label class="form-label">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="marca-nombre" placeholder="Ej: Toyota, Bosch, NGK...">
          </div>
          <div class="mb-3">
            <label class="form-label">Descripcion</label>
            <textarea class="form-control" id="marca-descripcion" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-guardar">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { marcasApi } from '/src/api/modules.js';
    import { requireAuth } from '/src/auth/auth.js';

    requireAuth();
    initLayout('config-marcas');

    let todas = [];
    const modal = new bootstrap.Modal('#modalMarca');

    async function cargar() {
      const res = await marcasApi.listar();
      todas = Array.isArray(res.data) ? res.data : (res.data?.data || []);
      renderizar(todas);
    }

    function renderizar(items) {
      document.getElementById('badge-count').textContent = items.length;
      const el = document.getElementById('lista-marcas');
      if (!items.length) {
        el.innerHTML = '<div class="text-center py-4 text-muted">Sin marcas registradas</div>';
        return;
      }
      el.innerHTML = items.map(m => `
        <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
          <div>
            <span class="fw-semibold">${m.nombre}</span>
            ${m.descripcion ? '<br><small class="text-muted">' + m.descripcion + '</small>' : ''}
          </div>
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-primary btn-edit" data-id="${m.id}"
                    data-nombre="${m.nombre}" data-desc="${m.descripcion || ''}">
              <i class="bi bi-pencil"></i>
            </button>
          </div>
        </div>`).join('');

      el.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('marca-id').value = btn.dataset.id;
          document.getElementById('marca-nombre').value = btn.dataset.nombre;
          document.getElementById('marca-descripcion').value = btn.dataset.desc;
          document.getElementById('modal-titulo').textContent = 'Editar Marca';
          modal.show();
        });
      });
    }

    document.getElementById('f-search').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      renderizar(todas.filter(m => m.nombre.toLowerCase().includes(q)));
    });

    document.getElementById('btn-nueva').addEventListener('click', () => {
      document.getElementById('marca-id').value = '';
      document.getElementById('marca-nombre').value = '';
      document.getElementById('marca-descripcion').value = '';
      document.getElementById('modal-titulo').textContent = 'Nueva Marca';
      modal.show();
    });

    document.getElementById('btn-guardar').addEventListener('click', async () => {
      const id = document.getElementById('marca-id').value;
      const nombre = document.getElementById('marca-nombre').value.trim();
      if (!nombre) { alert('El nombre es requerido'); return; }
      try {
        const data = { nombre, descripcion: document.getElementById('marca-descripcion').value.trim() || undefined };
        if (id) await marcasApi.actualizar(id, data);
        else await marcasApi.crear(data);
        modal.hide();
        cargar();
      } catch (e) {
        alert(e.message || 'Error al guardar');
      }
    });

    cargar();
  </script>
</body>
</html>
