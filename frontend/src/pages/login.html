<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: linear-gradient(135deg, #1a56db 0%, #0d3b8e 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { max-width: 420px; width: 100%; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-logo { font-size: 2.5rem; color: #1a56db; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12">
        <div class="card login-card mx-auto">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <div class="login-logo"><i class="bi bi-grid-3x3-gap-fill"></i></div>
              <h2 class="fw-bold mt-2">ERP Daytona</h2>
              <p class="text-muted">Sistema de Gestión Empresarial</p>
            </div>

            <div id="alert-error" class="alert alert-danger d-none" role="alert"></div>

            <form id="form-login" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" class="form-control form-control-lg" placeholder="admin@empresa.pe" required autocomplete="username">
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••••" required autocomplete="current-password">
                  <button class="btn btn-outline-secondary" type="button" id="btn-toggle-pass">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100" id="btn-login">
                <span id="btn-login-text">Iniciar Sesión</span>
                <span id="btn-login-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
              </button>
            </form>

            <div class="text-center mt-3">
              <small class="text-muted">Versión 1.0.0</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { api } from '/src/api/client.js';
    import { authApi } from '/src/api/modules.js';

    // Redirigir si ya está autenticado
    if (api.getToken()) {
      window.location.href = '/src/pages/dashboard.html';
    }

    const form = document.getElementById('form-login');
    const alertError = document.getElementById('alert-error');
    const btnLogin = document.getElementById('btn-login');
    const btnText = document.getElementById('btn-login-text');
    const btnSpinner = document.getElementById('btn-login-spinner');

    // Toggle password visibility
    document.getElementById('btn-toggle-pass').addEventListener('click', () => {
      const inp = document.getElementById('password');
      const icon = document.querySelector('#btn-toggle-pass i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'bi bi-eye';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        mostrarError('Complete todos los campos.');
        return;
      }

      setLoading(true);
      alertError.classList.add('d-none');

      try {
        const res = await authApi.login({ email, password });
        api.setToken(res.data.accessToken);
        api.setUser(res.data.usuario);
        window.location.href = '/src/pages/dashboard.html';
      } catch (err) {
        const msg = err?.data?.message || err?.message || 'Credenciales inválidas';
        mostrarError(Array.isArray(msg) ? msg.join(', ') : msg);
      } finally {
        setLoading(false);
      }
    });

    function setLoading(loading) {
      btnLogin.disabled = loading;
      btnText.textContent = loading ? 'Verificando...' : 'Iniciar Sesión';
      btnSpinner.classList.toggle('d-none', !loading);
    }

    function mostrarError(msg) {
      alertError.textContent = msg;
      alertError.classList.remove('d-none');
    }
  </script>
</body>
</html>
