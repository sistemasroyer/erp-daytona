<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes de Compra — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0"><i class="bi bi-file-earmark-text me-2 text-primary"></i>Órdenes de Compra</h5>
      <button class="btn btn-primary" id="btn-nueva"><i class="bi bi-plus-lg me-1"></i>Nueva Orden</button>
    </div>

    <div class="card mb-3">
      <div class="card-body py-2">
        <div class="row g-2">
          <div class="col-sm-4">
            <select class="form-select form-select-sm" id="f-estado">
              <option value="">Todos los estados</option>
              <option value="borrador">Borrador</option>
              <option value="aprobado">Aprobado</option>
              <option value="convertido">Convertido</option>
              <option value="anulado">Anulado</option>
            </select>
          </div>
          <div class="col-sm-2">
            <button class="btn btn-primary btn-sm w-100" id="btn-filtrar"><i class="bi bi-funnel me-1"></i>Filtrar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-sm mb-0">
            <thead class="table-light">
              <tr>
                <th>N° Orden</th>
                <th>Proveedor</th>
                <th>Solicitante</th>
                <th>Fecha solicitud</th>
                <th>Fecha requerida</th>
                <th class="text-center">Estado</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-ordenes">
              <tr><td colspan="7" class="text-center py-4 text-muted">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer d-flex justify-content-between">
        <span class="text-muted small" id="info-res">-</span>
        <div id="paginacion"></div>
      </div>
    </div>
  </div>

  <!-- Modal nueva orden -->
  <div class="modal fade" id="modal-orden" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nueva Orden de Compra</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Proveedor <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="o-prov-search" placeholder="Buscar proveedor...">
              <input type="hidden" id="o-id-prov">
              <div class="small text-success mt-1" id="o-prov-sel"></div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Moneda</label>
              <select class="form-select" id="o-moneda">
                <option value="PEN">PEN</option>
                <option value="USD">USD</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Fecha requerida</label>
              <input type="date" class="form-control" id="o-fecha-req">
            </div>
            <div class="col-12">
              <label class="form-label">Observaciones</label>
              <textarea class="form-control" id="o-obs" rows="2"></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0">Productos</h6>
            <button type="button" class="btn btn-sm btn-outline-primary" id="btn-add-item-orden">
              <i class="bi bi-plus-lg"></i> Agregar
            </button>
          </div>
          <div id="orden-items">
            <div class="text-center text-muted py-3" id="empty-orden">Agregue productos</div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="btn-guardar-orden">Crear Orden</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal detalle orden -->
  <div class="modal fade" id="modal-detalle" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detalle de Orden</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detalle-body">Cargando...</div>
        <div class="modal-footer" id="detalle-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { api } from '/src/api/client.js';
    import { ordenesApi, proveedoresApi, productosApi } from '/src/api/modules.js';
    import { formatMoneda, formatFecha, badgeEstado, renderPaginacion } from '/src/components/tabla.js';
    import { toast, toastError } from '/src/components/toast.js';
    import { confirmar } from '/src/components/modal.js';
    import { logout } from '/src/auth/auth.js';

    if (!api.getToken()) window.location.href = '/src/pages/login.html';
    initLayout('ordenes');
    document.getElementById('btn-logout').addEventListener('click', () => logout());

    let paginaActual = 1, ordenActual = null;
    let itemsOrden = [];
    let todosProd = [];
    const LIMIT = 20;

    async function cargar(page = 1) {
      paginaActual = page;
      const tbody = document.getElementById('tabla-ordenes');
      tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4"><span class="spinner-border spinner-border-sm"></span></td></tr>';
      try {
        const res = await ordenesApi.listar({ estado: document.getElementById('f-estado').value || undefined, page, limit: LIMIT });
        const items = Array.isArray(res.data) ? res.data : res.data?.ordenes || [];
        const total = res.data?.total ?? items.length;
        document.getElementById('info-res').textContent = `${total} órdenes`;

        tbody.innerHTML = items.length ? items.map((o) => `
          <tr>
            <td class="fw-semibold">${o.numero}</td>
            <td>${o.proveedor?.razon_social || '-'}</td>
            <td class="small">${o.solicitante ? `${o.solicitante.nombre} ${o.solicitante.apellido}` : '-'}</td>
            <td>${formatFecha(o.fecha_solicitud)}</td>
            <td>${o.fecha_requerida ? formatFecha(o.fecha_requerida) : '-'}</td>
            <td class="text-center">${badgeEstado(o.estado)}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary me-1 btn-ver" data-id="${o.id}"><i class="bi bi-eye"></i></button>
              ${o.estado === 'borrador' ? `<button class="btn btn-sm btn-outline-success btn-aprobar" data-id="${o.id}" title="Aprobar"><i class="bi bi-check-lg"></i></button>` : ''}
              ${o.estado === 'aprobado' ? `<a href="/src/pages/compras/nueva.html?orden=${o.id}" class="btn btn-sm btn-outline-warning" title="Convertir a compra"><i class="bi bi-arrow-right-circle"></i></a>` : ''}
            </td>
          </tr>`).join('') : '<tr><td colspan="7" class="text-center text-muted py-4">Sin órdenes</td></tr>';

        renderPaginacion(document.getElementById('paginacion'), { page, total, limit: LIMIT }, cargar);
        tbody.querySelectorAll('.btn-ver').forEach((b) => b.addEventListener('click', () => verDetalle(b.dataset.id)));
        tbody.querySelectorAll('.btn-aprobar').forEach((b) => b.addEventListener('click', () => aprobar(b.dataset.id)));
      } catch (err) { toastError(err); }
    }

    async function verDetalle(id) {
      const modal = new bootstrap.Modal(document.getElementById('modal-detalle'));
      document.getElementById('detalle-body').innerHTML = '<div class="text-center py-4"><span class="spinner-border"></span></div>';
      document.getElementById('detalle-footer').innerHTML = '<button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>';
      modal.show();
      try {
        const res = await ordenesApi.obtener(id);
        const o = res.data || res;
        ordenActual = o;
        const detalles = o.detalle_ordenes || o.detalles || [];

        document.getElementById('detalle-body').innerHTML = `
          <div class="row mb-3">
            <div class="col-6">
              <table class="table table-sm table-borderless">
                <tr><th class="text-muted">N° Orden</th><td>${o.numero}</td></tr>
                <tr><th class="text-muted">Estado</th><td>${badgeEstado(o.estado)}</td></tr>
                <tr><th class="text-muted">Proveedor</th><td>${o.proveedor?.razon_social || '-'}</td></tr>
                <tr><th class="text-muted">Moneda</th><td>${o.moneda}</td></tr>
              </table>
            </div>
            <div class="col-6">
              <table class="table table-sm table-borderless">
                <tr><th class="text-muted">Solicitante</th><td>${o.solicitante ? `${o.solicitante.nombre} ${o.solicitante.apellido}` : '-'}</td></tr>
                <tr><th class="text-muted">Aprobador</th><td>${o.aprobador ? `${o.aprobador.nombre} ${o.aprobador.apellido}` : 'Pendiente'}</td></tr>
                <tr><th class="text-muted">Fecha solicitud</th><td>${formatFecha(o.fecha_solicitud)}</td></tr>
                <tr><th class="text-muted">Fecha requerida</th><td>${o.fecha_requerida ? formatFecha(o.fecha_requerida) : '-'}</td></tr>
              </table>
            </div>
          </div>
          <table class="table table-sm table-striped">
            <thead class="table-dark"><tr><th>Producto</th><th class="text-end">Cantidad</th><th class="text-end">P. Referencial</th><th class="text-end">Total Ref.</th></tr></thead>
            <tbody>
              ${detalles.map((d) => `
              <tr>
                <td>${d.producto?.nombre || d.id_producto}</td>
                <td class="text-end">${Number(d.cantidad).toFixed(4)}</td>
                <td class="text-end">${formatMoneda(d.precio_referencial || 0, o.moneda)}</td>
                <td class="text-end fw-semibold">${formatMoneda(Number(d.cantidad) * Number(d.precio_referencial || 0), o.moneda)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
          ${o.observaciones ? `<div class="alert alert-light mt-2"><strong>Observaciones:</strong> ${o.observaciones}</div>` : ''}`;

        const footer = document.getElementById('detalle-footer');
        if (o.estado === 'borrador') {
          footer.innerHTML = `
            <button class="btn btn-danger btn-anular-orden" data-id="${o.id}"><i class="bi bi-x-circle me-1"></i>Anular</button>
            <button class="btn btn-success btn-aprobar-det" data-id="${o.id}"><i class="bi bi-check-lg me-1"></i>Aprobar</button>
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>`;
          footer.querySelector('.btn-anular-orden').addEventListener('click', () => anular(o.id));
          footer.querySelector('.btn-aprobar-det').addEventListener('click', () => aprobar(o.id));
        } else {
          footer.innerHTML = '<button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>';
        }
      } catch (err) {
        document.getElementById('detalle-body').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    async function aprobar(id) {
      const ok = await confirmar('¿Aprobar esta orden de compra?', 'Aprobar Orden');
      if (!ok) return;
      try {
        await ordenesApi.aprobar(id);
        toast('Orden aprobada');
        bootstrap.Modal.getInstance(document.getElementById('modal-detalle'))?.hide();
        cargar(paginaActual);
      } catch (err) { toastError(err); }
    }

    async function anular(id) {
      const ok = await confirmar('¿Anular esta orden de compra?', 'Anular Orden');
      if (!ok) return;
      try {
        await ordenesApi.anular(id);
        toast('Orden anulada');
        bootstrap.Modal.getInstance(document.getElementById('modal-detalle'))?.hide();
        cargar(paginaActual);
      } catch (err) { toastError(err); }
    }

    // Nueva orden
    document.getElementById('btn-nueva').addEventListener('click', () => {
      itemsOrden = [];
      document.getElementById('o-prov-search').value = '';
      document.getElementById('o-id-prov').value = '';
      document.getElementById('o-prov-sel').textContent = '';
      document.getElementById('o-obs').value = '';
      document.getElementById('orden-items').innerHTML = '<div class="text-center text-muted py-3" id="empty-orden">Agregue productos</div>';
      new bootstrap.Modal(document.getElementById('modal-orden')).show();
    });

    let timerProvOrden = null;
    document.getElementById('o-prov-search').addEventListener('input', (e) => {
      clearTimeout(timerProvOrden);
      const q = e.target.value.trim();
      if (q.length < 2) return;
      timerProvOrden = setTimeout(async () => {
        try {
          const res = await proveedoresApi.listar({ search: q, limit: 5 });
          const provs = Array.isArray(res.data) ? res.data : res.data?.proveedores || [];
          if (provs.length === 1) {
            document.getElementById('o-id-prov').value = provs[0].id;
            document.getElementById('o-prov-search').value = provs[0].razon_social;
            document.getElementById('o-prov-sel').textContent = `✓ ${provs[0].razon_social}`;
          }
        } catch (_) {}
      }, 400);
    });

    document.getElementById('btn-add-item-orden').addEventListener('click', async () => {
      const nombre = prompt('Código o nombre del producto:');
      if (!nombre) return;
      try {
        const res = await productosApi.listar({ search: nombre, limit: 1 });
        const prods = Array.isArray(res.data) ? res.data : res.data?.productos || [];
        if (!prods.length) { toast('Producto no encontrado', 'warning'); return; }
        const prod = prods[0];
        const cantidad = parseFloat(prompt(`Cantidad para "${prod.nombre}":`) || '0');
        const precio = parseFloat(prompt(`Precio referencial (${document.getElementById('o-moneda').value}):`) || '0');
        if (cantidad <= 0) { toast('Cantidad inválida', 'warning'); return; }
        itemsOrden.push({ prod, cantidad, precio });
        renderOrdenItems();
      } catch (err) { toastError(err); }
    });

    function renderOrdenItems() {
      const cont = document.getElementById('orden-items');
      cont.innerHTML = itemsOrden.map((i, idx) => `
        <div class="d-flex justify-content-between align-items-center border rounded p-2 mb-1">
          <div>
            <div class="fw-semibold">${i.prod.nombre}</div>
            <div class="text-muted small">Cant: ${i.cantidad} × ${formatMoneda(i.precio)} = ${formatMoneda(i.cantidad * i.precio)}</div>
          </div>
          <button type="button" class="btn btn-sm btn-outline-danger btn-rm-item" data-idx="${idx}"><i class="bi bi-trash"></i></button>
        </div>`).join('') || '<div class="text-center text-muted py-3">Agregue productos</div>';
      cont.querySelectorAll('.btn-rm-item').forEach((b) => {
        b.addEventListener('click', () => { itemsOrden.splice(+b.dataset.idx, 1); renderOrdenItems(); });
      });
    }

    document.getElementById('btn-guardar-orden').addEventListener('click', async () => {
      if (!document.getElementById('o-id-prov').value) { toast('Seleccione un proveedor', 'warning'); return; }
      if (itemsOrden.length === 0) { toast('Agregue productos', 'warning'); return; }
      try {
        await ordenesApi.crear({
          id_proveedor: document.getElementById('o-id-prov').value,
          moneda: document.getElementById('o-moneda').value,
          fecha_requerida: document.getElementById('o-fecha-req').value || undefined,
          observaciones: document.getElementById('o-obs').value || undefined,
          detalles: itemsOrden.map((i) => ({ id_producto: i.prod.id, cantidad: i.cantidad, precio_referencial: i.precio })),
        });
        toast('Orden creada correctamente');
        bootstrap.Modal.getInstance(document.getElementById('modal-orden')).hide();
        cargar(paginaActual);
      } catch (err) { toastError(err); }
    });

    document.getElementById('btn-filtrar').addEventListener('click', () => cargar(1));
    cargar();
  </script>
</body>
</html>
