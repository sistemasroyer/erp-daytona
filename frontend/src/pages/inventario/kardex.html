<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kardex — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="container-fluid p-4">
    <div class="card mb-3">
      <div class="card-body py-2">
        <div class="row g-2 align-items-end">
          <div class="col-sm-4">
            <label class="form-label small mb-1">Producto</label>
            <div class="position-relative">
              <input type="text" class="form-control form-control-sm" id="prod-search" placeholder="Buscar por código o nombre..." autocomplete="off">
              <div id="prod-resultados" class="list-group position-absolute w-100" style="z-index:1050;display:none;max-height:220px;overflow-y:auto"></div>
            </div>
          </div>
          <div class="col-sm-2">
            <label class="form-label small mb-1">Desde</label>
            <input type="date" class="form-control form-control-sm" id="f-desde">
          </div>
          <div class="col-sm-2">
            <label class="form-label small mb-1">Hasta</label>
            <input type="date" class="form-control form-control-sm" id="f-hasta">
          </div>
          <div class="col-sm-2">
            <label class="form-label small mb-1">Almacén</label>
            <select class="form-select form-select-sm" id="f-almacen">
              <option value="">Todos</option>
            </select>
          </div>
          <div class="col-sm-2">
            <button class="btn btn-primary btn-sm w-100" id="btn-filtrar"><i class="bi bi-funnel me-1"></i>Filtrar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3" id="card-producto" style="display:none">
      <div class="card-body py-2">
        <div class="row">
          <div class="col-md-3">
            <div class="text-muted small">Producto</div>
            <div class="fw-bold" id="prod-nombre">-</div>
          </div>
          <div class="col-md-2">
            <div class="text-muted small">Código</div>
            <div class="fw-semibold" id="prod-codigo">-</div>
          </div>
          <div class="col-md-2">
            <div class="text-muted small">Stock actual</div>
            <div class="fw-bold text-primary" id="prod-stock">-</div>
          </div>
          <div class="col-md-2">
            <div class="text-muted small">Costo promedio</div>
            <div id="prod-costo">-</div>
          </div>
          <div class="col-md-3">
            <div class="text-muted small">Método valuación</div>
            <div><span class="badge bg-info">Costo Promedio Ponderado</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="mb-0 fw-semibold"><i class="bi bi-clock-history me-2"></i>Movimientos Kardex</h6>
        <span class="text-muted small" id="info-count">-</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-sm table-hover mb-0">
            <thead class="table-dark">
              <tr>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Referencia</th>
                <th class="text-end">Entrada</th>
                <th class="text-end">Salida</th>
                <th class="text-end">C. Unitario</th>
                <th class="text-end">C. Total</th>
                <th class="text-end">Stock</th>
              </tr>
            </thead>
            <tbody id="tabla-kardex">
              <tr><td colspan="8" class="text-center py-4 text-muted">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { api } from '/src/api/client.js';
    import { reportesApi, almacenesApi, productosApi } from '/src/api/modules.js';
    import { formatMoneda, formatFechaHora } from '/src/components/tabla.js';
    import { toastError } from '/src/components/toast.js';
    import { logout } from '/src/auth/auth.js';

    if (!api.getToken()) window.location.href = '/src/pages/login.html';
    initLayout('kardex');
    document.getElementById('btn-logout').addEventListener('click', () => logout());

    const TIPO_MOVIMIENTO_LABEL = {
      entrada: 'Entrada', salida: 'Salida',
      ajuste_positivo: 'Ajuste (+)', ajuste_negativo: 'Ajuste (-)',
      transferencia_entrada: 'Transf. entrada', transferencia_salida: 'Transf. salida',
    };
    const TIPO_REFERENCIA_LABEL = {
      venta: 'Venta', compra: 'Compra', ajuste: 'Ajuste',
      transferencia: 'Transferencia', inventario_inicial: 'Inventario inicial',
    };

    const params = new URLSearchParams(window.location.search);
    let idProducto = params.get('id');

    if (!idProducto) {
      document.getElementById('tabla-kardex').innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Busque un producto arriba para ver su kardex</td></tr>';
    }

    const hoy = new Date();
    const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().split('T')[0];
    document.getElementById('f-desde').value = primerDia;
    document.getElementById('f-hasta').value = hoy.toISOString().split('T')[0];

    // ── Buscador de producto ─────────────────────────────────────────────────────
    let timerProd = null;
    document.getElementById('prod-search').addEventListener('input', (e) => {
      clearTimeout(timerProd);
      const q = e.target.value.trim();
      if (q.length < 2) { document.getElementById('prod-resultados').style.display = 'none'; return; }
      timerProd = setTimeout(async () => {
        try {
          const res = await productosApi.listar({ search: q, limit: 8 });
          const prods = res.data || [];
          const cont = document.getElementById('prod-resultados');
          cont.style.display = prods.length ? 'block' : 'none';
          cont.innerHTML = prods.map((p) => `
            <button type="button" class="list-group-item list-group-item-action py-1 small" data-id="${p.id}">
              <strong>${p.codigo}</strong> — ${p.nombre}
            </button>`).join('');
          cont.querySelectorAll('button').forEach((btn) => {
            btn.addEventListener('click', () => {
              cont.style.display = 'none';
              document.getElementById('prod-search').value = '';
              seleccionarProducto(btn.dataset.id);
            });
          });
        } catch (_) {}
      }, 300);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#prod-search')) document.getElementById('prod-resultados').style.display = 'none';
    });

    function seleccionarProducto(id) {
      idProducto = id;
      const url = new URL(window.location.href);
      url.searchParams.set('id', id);
      window.history.replaceState({}, '', url);
      cargarProducto();
      cargar();
    }

    async function cargarProducto() {
      if (!idProducto) return;
      try {
        const prodRes = await productosApi.obtener(idProducto);
        const p = prodRes.data || prodRes;
        document.getElementById('card-producto').style.display = '';
        document.getElementById('prod-nombre').textContent = p.nombre;
        document.getElementById('prod-codigo').textContent = p.codigo;
        document.getElementById('prod-stock').textContent = Number(p.stock_actual || 0).toFixed(4);
        document.getElementById('prod-costo').textContent = formatMoneda(p.costo_promedio);
      } catch (err) { toastError(err); }
    }

    async function init() {
      try {
        const almRes = await almacenesApi.listar();
        const almacenes = Array.isArray(almRes.data) ? almRes.data : almRes.data?.almacenes || [];
        almacenes.forEach((a) => document.getElementById('f-almacen').add(new Option(a.nombre, a.id)));
      } catch (err) { toastError(err); }
      await cargarProducto();
      cargar();
    }

    async function cargar() {
      if (!idProducto) return;
      const tbody = document.getElementById('tabla-kardex');
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4"><span class="spinner-border spinner-border-sm"></span></td></tr>';
      try {
        const res = await reportesApi.kardex(idProducto, {
          fecha_desde: document.getElementById('f-desde').value || undefined,
          fecha_hasta: document.getElementById('f-hasta').value || undefined,
          id_almacen: document.getElementById('f-almacen').value || undefined,
        });
        const items = Array.isArray(res.data) ? res.data : [];
        const total = res.meta?.total ?? items.length;
        document.getElementById('info-count').textContent = total > items.length
          ? `${items.length} de ${total} movimientos (reduzca el rango de fechas para ver el resto)`
          : `${total} movimientos`;

        tbody.innerHTML = items.length ? items.map((k) => {
          const esEntrada = Number(k.cantidad_entrada) > 0;
          return `
          <tr>
            <td class="small">${formatFechaHora(k.fecha)}</td>
            <td><span class="badge ${esEntrada ? 'bg-success' : 'bg-danger'}">${TIPO_MOVIMIENTO_LABEL[k.tipo_movimiento] || k.tipo_movimiento}</span></td>
            <td class="small text-muted">${TIPO_REFERENCIA_LABEL[k.tipo_referencia] || k.tipo_referencia || '-'}</td>
            <td class="text-end ${k.cantidad_entrada > 0 ? 'text-success fw-semibold' : 'text-muted'}">
              ${Number(k.cantidad_entrada) > 0 ? Number(k.cantidad_entrada).toFixed(4) : '-'}
            </td>
            <td class="text-end ${k.cantidad_salida > 0 ? 'text-danger fw-semibold' : 'text-muted'}">
              ${Number(k.cantidad_salida) > 0 ? Number(k.cantidad_salida).toFixed(4) : '-'}
            </td>
            <td class="text-end">${formatMoneda(k.costo_unitario)}</td>
            <td class="text-end">${formatMoneda(k.costo_total)}</td>
            <td class="text-end fw-bold">${Number(k.stock_resultante).toFixed(4)}</td>
          </tr>`;
        }).join('') : '<tr><td colspan="8" class="text-center text-muted py-4">Sin movimientos en el período</td></tr>';
      } catch (err) { toastError(err); }
    }

    document.getElementById('btn-filtrar').addEventListener('click', cargar);
    init();
  </script>
</body>
</html>
