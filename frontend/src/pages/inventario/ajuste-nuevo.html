<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Ajuste de Inventario — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <style>
    .item-row { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid #dee2e6; }
  </style>
</head>
<body>

  <div class="container-fluid p-3 p-md-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0"><i class="bi bi-sliders me-2 text-warning"></i>Nuevo Ajuste de Inventario</h5>
      <a href="/src/pages/inventario/ajustes.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Volver
      </a>
    </div>

    <form id="form-ajuste" novalidate>
      <div class="row g-3">
        <div class="col-lg-8">
          <div class="card mb-3 shadow-sm">
            <div class="card-header fw-semibold bg-white border-bottom">
              <i class="bi bi-file-earmark-text me-2 text-primary"></i>Datos del ajuste
            </div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Almacén <span class="text-danger">*</span></label>
                  <select class="form-select form-select-sm" id="id_almacen" required></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Motivo <span class="text-danger">*</span></label>
                  <select class="form-select form-select-sm" id="motivo" required>
                    <option value="mermas_mal_estado">Mermas / Mal estado</option>
                    <option value="entrega_trabajadores">Entrega a trabajadores</option>
                    <option value="sobrante_faltante">Sobrante / Faltante de inventario</option>
                    <option value="otros">Otros</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label small fw-semibold">Observaciones</label>
                  <input type="text" class="form-control form-control-sm" id="observaciones" placeholder="Detalle adicional del ajuste...">
                </div>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center">
              <span class="fw-semibold"><i class="bi bi-list-ul me-2 text-primary"></i>Productos del ajuste</span>
              <div class="position-relative">
                <input type="text" class="form-control form-control-sm" id="prod-search" placeholder="Buscar por código o nombre..." style="width:280px" autocomplete="off">
                <div id="prod-resultados" class="list-group position-absolute w-100" style="z-index:1050;display:none;max-height:220px;overflow-y:auto"></div>
              </div>
            </div>
            <div class="card-body">
              <div id="lista-items">
                <div class="text-center text-muted py-4" id="empty-items">
                  <i class="bi bi-box-seam fs-2 d-block mb-2"></i>
                  Busque y agregue los productos a ajustar
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card border-warning shadow-sm position-sticky" style="top:70px">
            <div class="card-header bg-warning fw-semibold">
              <i class="bi bi-sliders me-2"></i>Resumen del ajuste
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted small">Ítems con entrada (+)</span>
                <span id="r-entradas" class="fw-semibold text-success">0</span>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span class="text-muted small">Ítems con salida (-)</span>
                <span id="r-salidas" class="fw-semibold text-danger">0</span>
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-warning btn-lg" id="btn-guardar">
                  <i class="bi bi-check-circle me-2"></i>Registrar Ajuste
                </button>
                <a href="/src/pages/inventario/ajustes.html" class="btn btn-outline-secondary btn-sm">Cancelar</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { api } from '/src/api/client.js';
    import { inventarioApi, almacenesApi, productosApi } from '/src/api/modules.js';
    import { formatMoneda } from '/src/components/tabla.js';
    import { toast, toastError } from '/src/components/toast.js';

    if (!api.getToken()) window.location.href = '/src/pages/login.html';
    initLayout('inventario');

    let items = [];

    const selAlmacen = document.getElementById('id_almacen');
    selAlmacen.add(new Option('— Seleccione almacén —', ''));
    almacenesApi.listar().then((res) => {
      const alm = Array.isArray(res.data) ? res.data : [];
      alm.forEach((a) => selAlmacen.add(new Option(a.nombre, a.id)));
      if (alm.length === 1) selAlmacen.value = alm[0].id;
    }).catch(() => {});

    // ── Buscador de producto ─────────────────────────────────────────────────────
    let timerProd = null;
    document.getElementById('prod-search').addEventListener('input', (e) => {
      clearTimeout(timerProd);
      const q = e.target.value.trim();
      if (q.length < 2) { document.getElementById('prod-resultados').style.display = 'none'; return; }
      timerProd = setTimeout(async () => {
        try {
          const res = await productosApi.listar({ search: q, limit: 8 });
          const prods = res.data || [];
          const cont = document.getElementById('prod-resultados');
          cont.style.display = prods.length ? 'block' : 'none';
          cont.innerHTML = prods.map((p) => `
            <button type="button" class="list-group-item list-group-item-action py-1 small" data-id="${p.id}">
              <strong>${p.codigo}</strong> — ${p.nombre}
            </button>`).join('');
          cont.querySelectorAll('button').forEach((btn) => {
            btn.addEventListener('click', () => {
              const prod = prods.find((p) => p.id === btn.dataset.id);
              if (prod && !items.find((i) => i.prod.id === prod.id)) agregarItem(prod);
              document.getElementById('prod-search').value = '';
              cont.style.display = 'none';
            });
          });
        } catch (_) {}
      }, 300);
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#prod-search')) document.getElementById('prod-resultados').style.display = 'none';
    });

    function agregarItem(prod) {
      document.getElementById('empty-items').style.display = 'none';
      items.push({ prod, tipo: 'ajuste_negativo', cantidad: 1, costoUnitario: Number(prod.costo_promedio || 0) });
      renderItems();
    }

    function renderItems() {
      const lista = document.getElementById('lista-items');
      lista.querySelectorAll('.item-row').forEach((el) => el.remove());

      items.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <span class="fw-semibold">${item.prod.nombre}</span>
              <span class="text-muted small ms-2">${item.prod.codigo}</span>
            </div>
            <button type="button" class="btn btn-sm btn-outline-danger btn-quitar" data-idx="${idx}">
              <i class="bi bi-trash"></i>
            </button>
          </div>
          <div class="row g-2 align-items-end">
            <div class="col-6 col-md-3">
              <label class="form-label x-small mb-1">Tipo</label>
              <select class="form-select form-select-sm inp-tipo" data-idx="${idx}">
                <option value="ajuste_negativo" ${item.tipo === 'ajuste_negativo' ? 'selected' : ''}>Salida (-)</option>
                <option value="ajuste_positivo" ${item.tipo === 'ajuste_positivo' ? 'selected' : ''}>Entrada (+)</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label x-small mb-1">Cantidad</label>
              <input type="number" class="form-control form-control-sm inp-cant" data-idx="${idx}"
                value="${item.cantidad}" min="0.001" step="1">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label x-small mb-1">Costo unit. referencial</label>
              <div class="input-group input-group-sm">
                <span class="input-group-text">S/</span>
                <input type="number" class="form-control inp-costo" data-idx="${idx}"
                  value="${item.costoUnitario}" min="0" step="0.0001">
              </div>
            </div>
            <div class="col-6 col-md-3">
              <div class="text-muted small">Costo total ref.</div>
              <div class="fw-semibold">${formatMoneda(item.cantidad * item.costoUnitario)}</div>
            </div>
          </div>`;
        lista.appendChild(div);
      });

      lista.querySelectorAll('.btn-quitar').forEach((btn) => {
        btn.addEventListener('click', () => {
          items.splice(+btn.dataset.idx, 1);
          if (items.length === 0) document.getElementById('empty-items').style.display = '';
          renderItems();
        });
      });
      lista.querySelectorAll('.inp-tipo').forEach((sel) => {
        sel.addEventListener('change', () => { items[+sel.dataset.idx].tipo = sel.value; calcularResumen(); });
      });
      lista.querySelectorAll('.inp-cant').forEach((inp) => {
        inp.addEventListener('input', () => { items[+inp.dataset.idx].cantidad = parseFloat(inp.value) || 0; renderItems(); });
      });
      lista.querySelectorAll('.inp-costo').forEach((inp) => {
        inp.addEventListener('input', () => { items[+inp.dataset.idx].costoUnitario = parseFloat(inp.value) || 0; renderItems(); });
      });

      calcularResumen();
    }

    function calcularResumen() {
      document.getElementById('r-entradas').textContent = items.filter((i) => i.tipo === 'ajuste_positivo').length;
      document.getElementById('r-salidas').textContent = items.filter((i) => i.tipo === 'ajuste_negativo').length;
    }

    document.getElementById('form-ajuste').addEventListener('submit', async (e) => {
      e.preventDefault();

      const idAlmacen = document.getElementById('id_almacen').value;
      if (!idAlmacen) { toast('Seleccione un almacén', 'warning'); return; }
      if (items.length === 0) { toast('Agregue al menos un producto', 'warning'); return; }
      const itemsSinCantidad = items.filter((i) => !(i.cantidad > 0));
      if (itemsSinCantidad.length > 0) { toast('Hay ítems con cantidad inválida', 'warning'); return; }

      const btn = document.getElementById('btn-guardar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registrando...';

      const dto = {
        id_almacen: idAlmacen,
        motivo: document.getElementById('motivo').value,
        observaciones: document.getElementById('observaciones').value.trim() || undefined,
        detalle: items.map((i) => ({
          id_producto: i.prod.id,
          tipo: i.tipo,
          cantidad: i.cantidad,
          costo_unitario: i.costoUnitario || undefined,
        })),
      };

      try {
        const res = await inventarioApi.crearAjuste(dto);
        const ajuste = res.data || res;
        toast(`¡Ajuste ${ajuste.numero_interno} registrado correctamente!`, 'success');
        setTimeout(() => { window.location.href = '/src/pages/inventario/ajustes.html'; }, 1200);
      } catch (err) {
        toastError(err);
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Registrar Ajuste';
      }
    });
  </script>
</body>
</html>
