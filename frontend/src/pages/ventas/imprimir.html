<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imprimir Comprobante — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    @page { size: 80mm auto; margin: 0; }
    body { background: #e9ecef; }
    .ticket {
      width: 80mm;
      margin: 16px auto;
      background: #fff;
      padding: 4mm;
      box-shadow: 0 0 8px rgba(0,0,0,.2);
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      color: #000;
      line-height: 1.35;
    }
    .ticket img.logo { max-width: 55mm; max-height: 20mm; display: block; margin: 0 auto 4px; }
    .ticket h1 { font-size: 13px; font-weight: 700; text-align: center; margin: 0; }
    .center { text-align: center; }
    .right { text-align: right; }
    .bold { font-weight: 700; }
    .divider { border-top: 1px dashed #000; margin: 5px 0; }
    table.items { width: 100%; border-collapse: collapse; font-size: 10px; }
    table.items th, table.items td { padding: 1px 2px; vertical-align: top; }
    table.items th { border-bottom: 1px solid #000; text-align: left; }
    .qr-wrap { text-align: center; margin-top: 6px; }
    .qr-wrap canvas { margin: 0 auto; }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .ticket { box-shadow: none; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <div class="no-print container-fluid p-3 text-center">
    <button class="btn btn-primary" id="btn-imprimir"><i class="bi bi-printer me-1"></i>Imprimir</button>
    <button class="btn btn-outline-secondary" onclick="window.close()">Cerrar</button>
  </div>

  <div class="ticket" id="ticket">
    <p class="center">Cargando...</p>
  </div>

  <script type="module">
    import { api } from '/src/api/client.js';
    import { ventasApi, empresaApi } from '/src/api/modules.js';

    if (!api.getToken()) window.location.href = '/src/pages/login.html';

    const TIPO_DOC_LABEL = {
      FACTURA: 'FACTURA ELECTRÓNICA',
      BOLETA: 'BOLETA DE VENTA ELECTRÓNICA',
      NOTA_CREDITO: 'NOTA DE CRÉDITO ELECTRÓNICA',
      NOTA_DEBITO: 'NOTA DE DÉBITO ELECTRÓNICA',
      NOTA_VENTA: 'NOTA DE VENTA',
      COTIZACION: 'COTIZACIÓN',
    };

    function money(v, moneda) {
      const simb = moneda === 'USD' ? 'US$' : 'S/';
      return `${simb} ${Number(v || 0).toFixed(2)}`;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function render() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const ticket = document.getElementById('ticket');
      if (!id) { ticket.innerHTML = '<p class="center text-danger">No se especificó una venta</p>'; return; }

      try {
        const [ventaRes, empresaRes] = await Promise.all([
          ventasApi.obtener(id),
          empresaApi.obtener().catch(() => ({ data: null })),
        ]);
        const v = ventaRes.data || ventaRes;
        const e = empresaRes.data || {};
        const detalle = v.detalle || v.detalle_ventas || v.detalles || [];
        const pagos = v.pagos || [];
        const envio = (v.sunat_envios || [])[0];
        const numero = v.numero_comprobante || `${v.serie}-${String(v.correlativo).padStart(8, '0')}`;
        const esOficial = v.tipo_documento === 'FACTURA' || v.tipo_documento === 'BOLETA' || v.tipo_documento === 'NOTA_CREDITO';

        let sunatFooter = '';
        if (esOficial) {
          if (envio?.estado === 'aceptado') {
            sunatFooter = `
              <div class="divider"></div>
              <p class="center bold" style="font-size:10px">Representación impresa del comprobante electrónico</p>
              ${envio.codigo_hash ? `<p class="center" style="font-size:9px">Hash: ${escapeHtml(envio.codigo_hash)}</p>` : ''}
              <div class="qr-wrap"><canvas id="qr"></canvas></div>`;
          } else {
            sunatFooter = `
              <div class="divider"></div>
              <p class="center" style="font-size:10px">⚠ Documento aún no enviado/aceptado por SUNAT</p>`;
          }
        }

        ticket.innerHTML = `
          ${e.logo_base64 ? `<img class="logo" src="${e.logo_base64}">` : ''}
          <h1>${escapeHtml(e.nombre_comercial || e.razon_social || '')}</h1>
          <p class="center">${escapeHtml(e.razon_social || '')}</p>
          <p class="center">RUC: ${escapeHtml(e.ruc || '')}</p>
          <p class="center">${escapeHtml(e.direccion || '')}</p>
          ${e.telefono ? `<p class="center">Tel: ${escapeHtml(e.telefono)}</p>` : ''}
          <div class="divider"></div>
          <p class="center bold">${TIPO_DOC_LABEL[v.tipo_documento] || v.tipo_documento}</p>
          <p class="center bold">${escapeHtml(numero)}</p>
          <div class="divider"></div>
          <p>Fecha: ${new Date(v.fecha_emision).toLocaleString('es-PE')}</p>
          <p>Cliente: ${escapeHtml(v.cliente?.razon_social || '-')}</p>
          <p>${escapeHtml(v.cliente?.tipo_documento || '')}: ${escapeHtml(v.cliente?.numero_documento || '-')}</p>
          <div class="divider"></div>
          <table class="items">
            <thead>
              <tr><th>Cant</th><th>Descripción</th><th class="right">P.Unit</th><th class="right">Importe</th></tr>
            </thead>
            <tbody>
              ${detalle.map((d) => `
                <tr>
                  <td>${Number(d.cantidad).toFixed(2)}</td>
                  <td>${escapeHtml(d.producto?.nombre || d.descripcion || d.id_producto)}</td>
                  <td class="right">${Number(d.precio_unitario).toFixed(2)}</td>
                  <td class="right">${Number(d.total).toFixed(2)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
          <div class="divider"></div>
          <table style="width:100%">
            <tr><td>Subtotal:</td><td class="right">${money(v.subtotal, v.moneda)}</td></tr>
            <tr><td>IGV (18%):</td><td class="right">${money(v.igv, v.moneda)}</td></tr>
            <tr><td class="bold">TOTAL:</td><td class="right bold">${money(v.total, v.moneda)}</td></tr>
          </table>
          ${pagos.length ? `
            <div class="divider"></div>
            <p class="bold" style="margin-bottom:2px">Forma de pago:</p>
            ${pagos.map((p) => `<p style="margin:0">${escapeHtml(p.metodo_pago?.nombre || '-')}: ${money(p.monto, v.moneda)}</p>`).join('')}
          ` : ''}
          ${sunatFooter}
          <div class="divider"></div>
          <p class="center" style="font-size:9px">¡Gracias por su compra!</p>
        `;

        if (esOficial && envio?.estado === 'aceptado' && envio?.enlace) {
          const canvas = document.getElementById('qr');
          if (canvas && window.QRCode) {
            window.QRCode.toCanvas(canvas, envio.enlace, { width: 120, margin: 1 }, () => {});
          }
        }
      } catch (err) {
        ticket.innerHTML = `<p class="center text-danger">Error al cargar el comprobante: ${escapeHtml(err.message)}</p>`;
      }
    }

    document.getElementById('btn-imprimir').addEventListener('click', () => window.print());
    render();
  </script>
</body>
</html>
