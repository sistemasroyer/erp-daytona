<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Venta — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="container-fluid p-4">
    <form id="form-venta" novalidate>
      <div class="row g-3">

        <!-- Datos principales -->
        <div class="col-lg-8">
          <div class="card mb-3">
            <div class="card-header fw-semibold"><i class="bi bi-person me-2"></i>Datos del comprobante</div>
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-3">
                  <label class="form-label">Tipo de documento <span class="text-danger">*</span></label>
                  <select class="form-select" id="tipo_documento" required>
                    <option value="BOLETA" selected>Boleta de Venta</option>
                    <option value="FACTURA">Factura</option>
                    <option value="NOTA_VENTA">Nota de Venta</option>
                    <option value="COTIZACION">Cotización</option>
                  </select>
                  <div class="form-text" id="tipo-documento-hint"></div>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Serie <span class="text-danger">*</span></label>
                  <select class="form-select" id="id_serie_documento" required>
                    <option value="">Cargando...</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Moneda <span class="text-danger">*</span></label>
                  <select class="form-select" id="moneda">
                    <option value="PEN" selected>PEN (Soles)</option>
                    <option value="USD">USD (Dólares)</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Tipo de cambio</label>
                  <input type="number" class="form-control" id="tipo_cambio" value="3.80" step="0.001" min="0">
                </div>
                <div class="col-12">
                  <label class="form-label">Cliente <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="cliente-search" placeholder="Buscar cliente por nombre o documento...">
                    <button class="btn btn-outline-secondary" type="button" id="btn-cliente-generico" title="Usar cliente genérico">
                      <i class="bi bi-person-fill"></i> Genérico
                    </button>
                  </div>
                  <div id="cliente-resultados" class="list-group mt-1 position-absolute" style="z-index:1000;width:400px;display:none"></div>
                  <input type="hidden" id="id_cliente">
                  <div id="cliente-seleccionado" class="mt-1 text-success small"></div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Fecha de emisión</label>
                  <input type="date" class="form-control" id="fecha_emision">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Fecha de vencimiento</label>
                  <input type="date" class="form-control" id="fecha_vencimiento">
                </div>
                <div class="col-12">
                  <label class="form-label">Observaciones</label>
                  <textarea class="form-control" id="observaciones" rows="2" placeholder="Opcional..."></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- Detalle de productos -->
          <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center fw-semibold">
              <span><i class="bi bi-box-seam me-2"></i>Productos</span>
              <button type="button" class="btn btn-sm btn-outline-primary" id="btn-agregar-producto">
                <i class="bi bi-plus-lg me-1"></i>Agregar producto
              </button>
            </div>
            <div class="card-body">
              <div id="lista-productos">
                <div class="text-center text-muted py-3" id="empty-productos">
                  <i class="bi bi-cart-plus fs-2"></i><br>Agregue productos a la venta
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Panel de totales y pagos -->
        <div class="col-lg-4">
          <!-- Totales -->
          <div class="card mb-3 border-primary">
            <div class="card-header bg-primary text-white fw-semibold">Resumen</div>
            <div class="card-body">
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Subtotal</span>
                <span id="resumen-subtotal" class="fw-semibold">S/ 0.00</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">IGV (18%)</span>
                <span id="resumen-igv">S/ 0.00</span>
              </div>
              <hr>
              <div class="d-flex justify-content-between">
                <span class="fw-bold fs-5">TOTAL</span>
                <span class="fw-bold fs-5 text-primary" id="resumen-total">S/ 0.00</span>
              </div>
            </div>
          </div>

          <!-- Pagos -->
          <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center fw-semibold">
              <span><i class="bi bi-cash me-2"></i>Pagos</span>
              <button type="button" class="btn btn-sm btn-outline-success" id="btn-agregar-pago">
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>
            <div class="card-body" id="lista-pagos">
              <!-- pagos dinámicos -->
            </div>
            <div class="card-footer d-flex justify-content-between">
              <span class="text-muted small">Total pagado</span>
              <span class="fw-bold" id="total-pagado">S/ 0.00</span>
            </div>
          </div>

          <!-- Caja -->
          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-semibold">Caja activa</label>
              <select class="form-select" id="id_caja_apertura">
                <option value="">Sin asignar a caja</option>
              </select>
            </div>
          </div>

          <!-- Acciones -->
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success btn-lg" id="btn-guardar">
              <i class="bi bi-check-lg me-2"></i>Emitir Comprobante
            </button>
            <a href="/src/pages/ventas/index.html" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Modal buscar producto -->
  <div class="modal fade" id="modal-producto" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Seleccionar Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" class="form-control mb-3" id="buscar-producto" placeholder="Buscar por código o nombre...">
          <div class="table-responsive" style="max-height:400px;overflow-y:auto">
            <table class="table table-sm table-hover">
              <thead class="table-light sticky-top">
                <tr>
                  <th>Código</th>
                  <th>Nombre</th>
                  <th>Stock</th>
                  <th>Precio 1</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tabla-productos-modal">
                <tr><td colspan="5" class="text-center text-muted">Buscando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { api } from '/src/api/client.js';
    import { ventasApi, clientesApi, productosApi, cajaApi, seriesApi, metodosPagoApi } from '/src/api/modules.js';
    import { formatMoneda } from '/src/components/tabla.js';
    import { toast, toastError } from '/src/components/toast.js';

    if (!api.getToken()) window.location.href = '/src/pages/login.html';
    initLayout('ventas');

    // Estado de la venta
    const estado = {
      items: [],   // { producto, cantidad, precio, precio_tipo, descuento }
      pagos: [],   // { id_metodo_pago, nombre_metodo, monto }
      cliente: null,
      metodosPago: [],
      series: [],  // series del punto de venta actual
    };

    const TIPOS_DOC_HINT = {
      FACTURA: 'Documento oficial. Afecta stock y se envía a SUNAT. Requiere pago completo.',
      BOLETA: 'Documento oficial. Afecta stock y se envía a SUNAT. Requiere pago completo.',
      NOTA_VENTA: 'Documento interno. Afecta stock, pero no se envía a SUNAT. El pago es opcional.',
      COTIZACION: 'Documento interno. No afecta stock ni requiere pago. Se puede canjear luego a Boleta/Factura.',
    };

    let idPuntoVenta = null;
    try {
      const user = JSON.parse(localStorage.getItem('user') || 'null');
      idPuntoVenta = user?.idPuntoVenta || null;
    } catch (_) {}

    // Fecha por defecto
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fecha_emision').value = hoy;

    async function init() {
      try {
        const resMetodos = await metodosPagoApi.listar();
        estado.metodosPago = resMetodos.data || [];

        const resSeries = await seriesApi.listar(idPuntoVenta || undefined);
        estado.series = (resSeries.data || []).filter((s) => s.activo);

        actualizarSeriesDisponibles();
        actualizarHintTipoDocumento();
        actualizarTextoBoton();

        // Intentar cargar cajas activas
        try {
          const apertura = await cajaApi.miAperturaActiva();
          if (apertura) {
            const opt = document.createElement('option');
            opt.value = apertura.id;
            opt.textContent = `${apertura.caja?.nombre || 'Caja'} (abierta)`;
            opt.selected = true;
            document.getElementById('id_caja_apertura').appendChild(opt);
          }
        } catch (_) { /* sin caja activa */ }

        agregarPago();
      } catch (err) {
        toastError(err);
      }
    }

    function actualizarSeriesDisponibles() {
      const tipo = document.getElementById('tipo_documento').value;
      const sel = document.getElementById('id_serie_documento');
      const disponibles = estado.series.filter((s) => s.tipo_documento === tipo);
      sel.innerHTML = disponibles.length
        ? disponibles.map((s) => `<option value="${s.id}">${s.serie}</option>`).join('')
        : '<option value="">Sin series configuradas</option>';
    }

    function actualizarHintTipoDocumento() {
      const tipo = document.getElementById('tipo_documento').value;
      document.getElementById('tipo-documento-hint').textContent = TIPOS_DOC_HINT[tipo] || '';
    }

    const TEXTO_BOTON = {
      FACTURA: 'Emitir Factura', BOLETA: 'Emitir Boleta',
      NOTA_VENTA: 'Registrar Nota de Venta', COTIZACION: 'Registrar Cotización',
    };

    function actualizarTextoBoton() {
      const tipo = document.getElementById('tipo_documento').value;
      document.getElementById('btn-guardar').innerHTML =
        `<i class="bi bi-check-lg me-2"></i>${TEXTO_BOTON[tipo] || 'Guardar'}`;
    }

    document.getElementById('tipo_documento').addEventListener('change', () => {
      actualizarSeriesDisponibles();
      actualizarHintTipoDocumento();
      actualizarTextoBoton();
    });

    // ==================== CLIENTE ====================
    let timerCliente = null;
    document.getElementById('cliente-search').addEventListener('input', (e) => {
      clearTimeout(timerCliente);
      const q = e.target.value.trim();
      if (q.length < 2) { document.getElementById('cliente-resultados').style.display = 'none'; return; }
      timerCliente = setTimeout(() => buscarCliente(q), 350);
    });

    async function buscarCliente(q) {
      try {
        const res = await clientesApi.listar({ search: q, limit: 8 });
        const clientes = Array.isArray(res.data) ? res.data : res.data?.clientes || [];
        const cont = document.getElementById('cliente-resultados');
        cont.style.display = clientes.length ? 'block' : 'none';
        cont.innerHTML = clientes.map((c) => `
          <button type="button" class="list-group-item list-group-item-action" data-id="${c.id}" data-nombre="${c.razon_social}" data-doc="${c.numero_documento}">
            <strong>${c.razon_social}</strong> <span class="text-muted small">${c.numero_documento}</span>
          </button>`).join('');
        cont.querySelectorAll('button').forEach((btn) => {
          btn.addEventListener('click', () => seleccionarCliente({ id: btn.dataset.id, razon_social: btn.dataset.nombre, numero_documento: btn.dataset.doc }));
        });
      } catch (_) { }
    }

    function seleccionarCliente(c) {
      estado.cliente = c;
      document.getElementById('id_cliente').value = c.id;
      document.getElementById('cliente-search').value = c.razon_social;
      document.getElementById('cliente-seleccionado').textContent = `✓ ${c.razon_social} (${c.numero_documento})`;
      document.getElementById('cliente-resultados').style.display = 'none';
    }

    document.getElementById('btn-cliente-generico').addEventListener('click', async () => {
      try {
        const res = await clientesApi.listar({ search: 'Clientes varios', limit: 1 });
        const arr = Array.isArray(res.data) ? res.data : res.data?.clientes || [];
        if (arr.length) seleccionarCliente(arr[0]);
        else toast('No se encontró cliente genérico en el sistema', 'warning');
      } catch (err) { toastError(err); }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#cliente-search') && !e.target.closest('#cliente-resultados')) {
        document.getElementById('cliente-resultados').style.display = 'none';
      }
    });

    // ==================== PRODUCTOS ====================
    let todosProductos = [];

    document.getElementById('btn-agregar-producto').addEventListener('click', async () => {
      const modal = new bootstrap.Modal(document.getElementById('modal-producto'));
      modal.show();
      await cargarProductosModal('');
    });

    document.getElementById('buscar-producto').addEventListener('input', (e) => {
      cargarProductosModal(e.target.value);
    });

    async function cargarProductosModal(q) {
      const tbody = document.getElementById('tabla-productos-modal');
      try {
        const res = await productosApi.listar({ search: q, limit: 50 });
        const prods = Array.isArray(res.data) ? res.data : res.data?.productos || [];
        todosProductos = prods;
        tbody.innerHTML = prods.map((p) => `
          <tr>
            <td class="small">${p.codigo}</td>
            <td>${p.nombre}</td>
            <td class="text-end">${Number(p.stock_actual || 0).toFixed(2)}</td>
            <td class="text-end">${formatMoneda(p.precio_venta_1)}</td>
            <td>
              <button type="button" class="btn btn-sm btn-primary btn-sel-prod" data-id="${p.id}">
                <i class="bi bi-plus"></i>
              </button>
            </td>
          </tr>`).join('') || '<tr><td colspan="5" class="text-center text-muted">Sin resultados</td></tr>';

        tbody.querySelectorAll('.btn-sel-prod').forEach((btn) => {
          btn.addEventListener('click', () => {
            const prod = todosProductos.find((p) => p.id === btn.dataset.id);
            if (prod) agregarItem(prod);
            bootstrap.Modal.getInstance(document.getElementById('modal-producto')).hide();
          });
        });
      } catch (err) { toastError(err); }
    }

    function agregarItem(producto) {
      document.getElementById('empty-productos').style.display = 'none';
      const idx = estado.items.length;
      estado.items.push({ producto, cantidad: 1, precio_tipo: 1, precio: Number(producto.precio_venta_1), descuento: 0 });
      renderItems();
    }

    function renderItems() {
      const lista = document.getElementById('lista-productos');
      lista.innerHTML = '';
      if (estado.items.length === 0) {
        document.getElementById('empty-productos').style.display = '';
        lista.appendChild(document.getElementById('empty-productos'));
      }
      estado.items.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'detalle-item mb-2 p-3 bg-light rounded border';
        const precios = [1,2,3,4,5].map((n) => {
          const val = item.producto[`precio_venta_${n}`];
          return val && Number(val) > 0 ? `<option value="${n}" ${item.precio_tipo===n?'selected':''}>Precio ${n} — ${formatMoneda(val)}</option>` : '';
        }).join('');
        div.innerHTML = `
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div class="fw-semibold">${item.producto.nombre}</div>
            <button type="button" class="btn btn-sm btn-outline-danger btn-quitar" data-idx="${idx}">
              <i class="bi bi-trash"></i>
            </button>
          </div>
          <div class="row g-2">
            <div class="col-sm-3">
              <label class="form-label small mb-1">Cantidad</label>
              <input type="number" class="form-control form-control-sm inp-cantidad" data-idx="${idx}" value="${item.cantidad}" min="0.001" step="0.001">
            </div>
            <div class="col-sm-4">
              <label class="form-label small mb-1">Tipo precio</label>
              <select class="form-select form-select-sm sel-precio-tipo" data-idx="${idx}">${precios}</select>
            </div>
            <div class="col-sm-3">
              <label class="form-label small mb-1">Descuento</label>
              <input type="number" class="form-control form-control-sm inp-descuento" data-idx="${idx}" value="${item.descuento}" min="0" step="0.01">
            </div>
            <div class="col-sm-2 d-flex align-items-end">
              <div class="text-end w-100">
                <div class="small text-muted">Total</div>
                <div class="fw-bold total-item" data-idx="${idx}">${formatMoneda(calcularTotalItem(item))}</div>
              </div>
            </div>
          </div>`;
        lista.appendChild(div);
      });

      // Eventos
      lista.querySelectorAll('.btn-quitar').forEach((btn) => {
        btn.addEventListener('click', () => { estado.items.splice(+btn.dataset.idx, 1); renderItems(); calcularTotales(); });
      });
      lista.querySelectorAll('.inp-cantidad').forEach((inp) => {
        inp.addEventListener('change', () => {
          estado.items[+inp.dataset.idx].cantidad = parseFloat(inp.value) || 1;
          renderItems(); calcularTotales();
        });
      });
      lista.querySelectorAll('.sel-precio-tipo').forEach((sel) => {
        sel.addEventListener('change', () => {
          const idx = +sel.dataset.idx;
          const tipo = +sel.value;
          estado.items[idx].precio_tipo = tipo;
          estado.items[idx].precio = Number(estado.items[idx].producto[`precio_venta_${tipo}`]);
          renderItems(); calcularTotales();
        });
      });
      lista.querySelectorAll('.inp-descuento').forEach((inp) => {
        inp.addEventListener('change', () => {
          estado.items[+inp.dataset.idx].descuento = parseFloat(inp.value) || 0;
          calcularTotales();
        });
      });

      calcularTotales();
    }

    function calcularTotalItem(item) {
      return (item.cantidad * item.precio) - item.descuento;
    }

    function calcularTotales() {
      const total = estado.items.reduce((s, i) => s + calcularTotalItem(i), 0);
      const igv = total - (total / 1.18);
      const subtotal = total / 1.18;
      const moneda = document.getElementById('moneda').value;
      document.getElementById('resumen-subtotal').textContent = formatMoneda(subtotal, moneda);
      document.getElementById('resumen-igv').textContent = formatMoneda(igv, moneda);
      document.getElementById('resumen-total').textContent = formatMoneda(total, moneda);
      actualizarPrimerPago(total);
    }

    // ==================== PAGOS ====================
    function agregarPago() {
      const metodos = estado.metodosPago;
      const opciones = metodos.map((m) => `<option value="${m.id}">${m.nombre}</option>`).join('');
      const idx = estado.pagos.length;
      estado.pagos.push({ id_metodo_pago: metodos[0]?.id || '', monto: 0 });

      const lista = document.getElementById('lista-pagos');
      const div = document.createElement('div');
      div.className = 'd-flex gap-2 align-items-center mb-2';
      div.setAttribute('data-pago-idx', idx);
      div.innerHTML = `
        <select class="form-select form-select-sm sel-metodo" data-idx="${idx}">${opciones}</select>
        <input type="number" class="form-control form-control-sm inp-monto" data-idx="${idx}" value="0" min="0" step="0.01" style="width:100px">
        ${idx > 0 ? `<button type="button" class="btn btn-sm btn-outline-danger btn-quitar-pago" data-idx="${idx}"><i class="bi bi-x"></i></button>` : ''}`;
      lista.appendChild(div);

      lista.querySelectorAll('.sel-metodo, .inp-monto').forEach((el) => {
        el.addEventListener('change', () => {
          const i = +el.dataset.idx;
          if (el.classList.contains('sel-metodo')) estado.pagos[i].id_metodo_pago = el.value;
          if (el.classList.contains('inp-monto')) estado.pagos[i].monto = parseFloat(el.value) || 0;
          actualizarTotalPagado();
        });
      });

      lista.querySelectorAll('.btn-quitar-pago').forEach((btn) => {
        btn.addEventListener('click', () => {
          estado.pagos.splice(+btn.dataset.idx, 1);
          btn.closest('[data-pago-idx]').remove();
          actualizarTotalPagado();
        });
      });
    }

    function actualizarPrimerPago(total) {
      const inp = document.querySelector('.inp-monto[data-idx="0"]');
      if (inp && estado.pagos.length === 1) {
        inp.value = total.toFixed(2);
        estado.pagos[0].monto = total;
        actualizarTotalPagado();
      }
    }

    function actualizarTotalPagado() {
      const total = estado.pagos.reduce((s, p) => s + (p.monto || 0), 0);
      document.getElementById('total-pagado').textContent = formatMoneda(total);
    }

    document.getElementById('btn-agregar-pago').addEventListener('click', () => {
      if (estado.pagos.length >= 3) { toast('Máximo 3 métodos de pago', 'warning'); return; }
      agregarPago();
    });

    // ==================== GUARDAR ====================
    document.getElementById('form-venta').addEventListener('submit', async (e) => {
      e.preventDefault();

      const tipoDocumento = document.getElementById('tipo_documento').value;
      const esOficial = tipoDocumento === 'FACTURA' || tipoDocumento === 'BOLETA';
      const idSerie = document.getElementById('id_serie_documento').value;

      if (!document.getElementById('id_cliente').value) {
        toast('Seleccione un cliente', 'warning'); return;
      }
      if (!idSerie) {
        toast('No hay una serie configurada para este tipo de documento. Configúrela en Configuración → Series.', 'warning'); return;
      }
      if (estado.items.length === 0) {
        toast('Agregue al menos un producto', 'warning'); return;
      }

      const detalle = estado.items.map((item) => ({
        id_producto: item.producto.id,
        cantidad: item.cantidad,
        precio_tipo: item.precio_tipo,
        descuento: item.descuento || 0,
      }));

      const pagos = estado.pagos
        .filter((p) => p.monto > 0 && p.id_metodo_pago)
        .map((p) => ({ id_metodo_pago: p.id_metodo_pago, monto: p.monto }));

      const totalPagado = pagos.reduce((s, p) => s + p.monto, 0);
      const totalVenta = estado.items.reduce((s, i) => s + calcularTotalItem(i), 0);
      if (esOficial && totalPagado + 0.01 < totalVenta) {
        toast(`${tipoDocumento === 'FACTURA' ? 'La factura' : 'La boleta'} requiere el pago completo (falta S/ ${(totalVenta - totalPagado).toFixed(2)})`, 'warning');
        return;
      }

      const btn = document.getElementById('btn-guardar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Procesando...';

      try {
        const dto = {
          tipo_documento: tipoDocumento,
          id_serie_documento: idSerie,
          id_cliente: document.getElementById('id_cliente').value,
          moneda: document.getElementById('moneda').value,
          tipo_cambio: parseFloat(document.getElementById('tipo_cambio').value) || 3.80,
          fecha_emision: document.getElementById('fecha_emision').value,
          fecha_vencimiento: document.getElementById('fecha_vencimiento').value || undefined,
          observaciones: document.getElementById('observaciones').value || undefined,
          id_caja_apertura: document.getElementById('id_caja_apertura').value || undefined,
          detalle,
          pagos: pagos.length ? pagos : undefined,
        };

        const res = await ventasApi.crear(dto);
        const ventaCreada = res.data || res;

        if (ventaCreada.tipo_documento === 'FACTURA' || ventaCreada.tipo_documento === 'BOLETA') {
          const envio = (ventaCreada.sunat_envios || [])[0];
          if (ventaCreada.estado_sunat === 'aceptado') {
            toast('¡Documento emitido y aceptado por SUNAT!', 'success');
          } else if (ventaCreada.estado_sunat === 'rechazado' || ventaCreada.estado_sunat === 'error') {
            toast(`Documento emitido, pero SUNAT lo rechazó: ${envio?.error_mensaje || 'revise el detalle en Ventas'}`, 'danger', 6000);
          } else {
            toast('Documento emitido, envío a SUNAT en proceso...', 'success');
          }
        } else {
          toast('¡Documento emitido correctamente!', 'success');
        }
        setTimeout(() => { window.location.href = '/src/pages/ventas/index.html'; }, 1500);
      } catch (err) {
        toastError(err);
        btn.disabled = false;
        actualizarTextoBoton();
      }
    });

    init();
  </script>
</body>
</html>
