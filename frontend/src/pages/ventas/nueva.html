<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Venta — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="container-fluid p-3">
    <form id="form-venta" novalidate>

      <!-- Cabecera compacta: lo justo para no frenar una venta rápida -->
      <div class="card mb-2">
        <div class="card-body py-2">
          <div class="row g-2 align-items-end">
            <div class="col-md-2">
              <label class="form-label small mb-1">Documento <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm" id="tipo_documento" required>
                <option value="BOLETA" selected>Boleta</option>
                <option value="FACTURA">Factura</option>
                <option value="NOTA_VENTA">Nota de Venta</option>
                <option value="COTIZACION">Cotización</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label small mb-1">Serie <span class="text-danger">*</span></label>
              <select class="form-select form-select-sm" id="id_serie_documento" required>
                <option value="">Cargando...</option>
              </select>
            </div>
            <div class="col-md-5 position-relative">
              <label class="form-label small mb-1">Cliente <span class="text-danger">*</span></label>
              <div class="input-group input-group-sm">
                <input type="text" class="form-control" id="cliente-search" placeholder="Buscar cliente por nombre o documento...">
                <button class="btn btn-outline-secondary" type="button" id="btn-cliente-generico" title="Usar cliente genérico">
                  <i class="bi bi-person-fill"></i>
                </button>
                <button class="btn btn-outline-secondary" type="button" id="btn-cliente-nuevo" title="Nuevo cliente (consulta SUNAT/RENIEC)">
                  <i class="bi bi-person-plus-fill"></i>
                </button>
              </div>
              <div id="cliente-resultados" class="list-group mt-1 position-absolute" style="z-index:1000;width:100%;display:none"></div>
              <input type="hidden" id="id_cliente">
            </div>
            <div class="col-md-3">
              <div id="cliente-seleccionado" class="small text-success text-truncate"></div>
              <div class="form-text small mb-0" id="tipo-documento-hint"></div>
            </div>
          </div>
          <button type="button" class="btn btn-link btn-sm p-0 mt-1 text-decoration-none" id="btn-toggle-detalles">
            <i class="bi bi-chevron-down me-1"></i>Agregar observación
          </button>
          <div class="row g-2 mt-1 d-none" id="detalles-extra">
            <div class="col-12">
              <label class="form-label small mb-1">Observaciones</label>
              <input type="text" class="form-control form-control-sm" id="observaciones" placeholder="Opcional...">
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3">

        <!-- Productos: lo más importante de la pantalla -->
        <div class="col-lg-8">
          <div class="card mb-3 border-primary">
            <div class="card-header fw-semibold bg-primary text-white">
              <i class="bi bi-box-seam me-2"></i>Productos
              <span class="small fw-normal ms-2 opacity-75">Escriba el código o nombre y presione Enter para avanzar</span>
            </div>
            <div class="card-body p-0">
              <!-- Sin .table-responsive a propósito: ese wrapper de Bootstrap recorta
                   cualquier elemento posicionado que se salga de la tabla (dropdowns,
                   popovers) — y por eso las sugerencias de producto no se veían.
                   Al fijar overflow-x en cualquier valor (incluido "auto") ocurre lo
                   mismo, así que se deja sin scroll horizontal en esta tabla. -->
              <table class="table table-sm mb-0 align-middle">
                <thead class="table-light">
                  <tr>
                    <th style="width:140px">Código</th>
                    <th>Producto</th>
                    <th style="width:80px" class="text-end">Cant.</th>
                    <th style="width:180px">Precio</th>
                    <th style="width:100px" class="text-end">Total</th>
                    <th style="width:36px"></th>
                  </tr>
                </thead>
                <tbody id="filas-productos">
                  <tr id="fila-entrada">
                    <td class="position-relative">
                      <input type="text" class="form-control form-control-sm" id="entrada-codigo" placeholder="Código o nombre..." autocomplete="off">
                      <div id="entrada-sugerencias" class="list-group position-absolute" style="z-index:1000;width:340px;display:none;max-height:280px;overflow-y:auto"></div>
                    </td>
                    <td class="text-muted small" id="entrada-nombre">—</td>
                    <td><input type="number" class="form-control form-control-sm text-end" id="entrada-cantidad" value="1" min="1" step="1" disabled></td>
                    <td><select class="form-select form-select-sm" id="entrada-precio" disabled></select></td>
                    <td class="text-end small text-muted" id="entrada-total">—</td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Panel de totales y pagos -->
        <div class="col-lg-4">
          <!-- Totales -->
          <div class="card mb-3 border-primary">
            <div class="card-header bg-primary text-white fw-semibold">Resumen</div>
            <div class="card-body">
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Subtotal</span>
                <span id="resumen-subtotal" class="fw-semibold">S/ 0.00</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">IGV (18%)</span>
                <span id="resumen-igv">S/ 0.00</span>
              </div>
              <hr>
              <div class="d-flex justify-content-between">
                <span class="fw-bold fs-5">TOTAL</span>
                <span class="fw-bold fs-5 text-primary" id="resumen-total">S/ 0.00</span>
              </div>
            </div>
          </div>

          <!-- Pagos -->
          <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center fw-semibold">
              <span><i class="bi bi-cash me-2"></i>Pagos</span>
              <button type="button" class="btn btn-sm btn-outline-success" id="btn-agregar-pago">
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>
            <div class="card-body" id="lista-pagos">
              <!-- pagos dinámicos -->
            </div>
            <div class="card-footer d-flex justify-content-between">
              <span class="text-muted small">Total pagado</span>
              <span class="fw-bold" id="total-pagado">S/ 0.00</span>
            </div>
          </div>

          <!-- Caja -->
          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-semibold">Caja activa</label>
              <select class="form-select" id="id_caja_apertura">
                <option value="">Sin asignar a caja</option>
              </select>
            </div>
          </div>

          <!-- Acciones -->
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success btn-lg" id="btn-guardar">
              <i class="bi bi-check-lg me-2"></i>Emitir Comprobante
            </button>
            <a href="/src/pages/ventas/index.html" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Modal nuevo cliente (con consulta SUNAT/RENIEC) -->
  <div class="modal fade" id="modal-cliente-nuevo" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nuevo Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Tipo documento</label>
              <select class="form-select" id="nc-tipo">
                <option value="RUC">RUC</option>
                <option value="DNI" selected>DNI</option>
                <option value="CE">Carné extranjería</option>
                <option value="PASAPORTE">Pasaporte</option>
              </select>
            </div>
            <div class="col-md-8">
              <label class="form-label">Número documento <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="text" class="form-control" id="nc-documento">
                <button class="btn btn-outline-secondary" type="button" id="btn-nc-consultar" title="Consultar SUNAT/RENIEC">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </div>
            <div class="col-12">
              <label class="form-label">Nombre / Razón social <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="nc-razon">
            </div>
            <div class="col-md-6">
              <label class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="nc-telefono">
            </div>
            <div class="col-md-6">
              <label class="form-label">Dirección</label>
              <input type="text" class="form-control" id="nc-direccion">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="btn-nc-guardar">Guardar y usar en la venta</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { api } from '/src/api/client.js';
    import { ventasApi, clientesApi, productosApi, cajaApi, seriesApi, metodosPagoApi } from '/src/api/modules.js';
    import { formatMoneda } from '/src/components/tabla.js';
    import { toast, toastError } from '/src/components/toast.js';

    if (!api.getToken()) window.location.href = '/src/pages/login.html';
    initLayout('ventas');

    // Estado de la venta
    const estado = {
      items: [],   // { producto, cantidad, precio, precio_tipo }
      pagos: [],   // { id_metodo_pago, nombre_metodo, monto }
      cliente: null,
      metodosPago: [],
      series: [],  // series del punto de venta actual
    };

    const TIPOS_DOC_HINT = {
      FACTURA: '',
      BOLETA: '',
      NOTA_VENTA: '',
      COTIZACION: '',
    };

    let idPuntoVenta = null;
    try {
      const user = JSON.parse(localStorage.getItem('user') || 'null');
      idPuntoVenta = user?.idPuntoVenta || null;
    } catch (_) {}

    // Toggle "más datos" (fecha / observaciones) — oculto por defecto para no
    // quitarle espacio a lo importante: agregar productos.
    document.getElementById('btn-toggle-detalles').addEventListener('click', (e) => {
      const cont = document.getElementById('detalles-extra');
      const icon = e.currentTarget.querySelector('i');
      const abrir = cont.classList.contains('d-none');
      cont.classList.toggle('d-none', !abrir);
      icon.className = abrir ? 'bi bi-chevron-up me-1' : 'bi bi-chevron-down me-1';
    });

    async function init() {
      try {
        const resMetodos = await metodosPagoApi.listar();
        estado.metodosPago = resMetodos.data || [];

        const resSeries = await seriesApi.listar(idPuntoVenta || undefined);
        estado.series = (resSeries.data || []).filter((s) => s.activo);

        actualizarSeriesDisponibles();
        actualizarHintTipoDocumento();
        actualizarTextoBoton();

        // Intentar cargar cajas activas
        try {
          const apertura = await cajaApi.miAperturaActiva();
          if (apertura) {
            const opt = document.createElement('option');
            opt.value = apertura.id;
            opt.textContent = `${apertura.caja?.nombre || 'Caja'} (abierta)`;
            opt.selected = true;
            document.getElementById('id_caja_apertura').appendChild(opt);
          }
        } catch (_) { /* sin caja activa */ }

        agregarPago();
      } catch (err) {
        toastError(err);
      }
    }

    function actualizarSeriesDisponibles() {
      const tipo = document.getElementById('tipo_documento').value;
      const sel = document.getElementById('id_serie_documento');
      const disponibles = estado.series.filter((s) => s.tipo_documento === tipo);
      sel.innerHTML = disponibles.length
        ? disponibles.map((s) => `<option value="${s.id}">${s.serie}</option>`).join('')
        : '<option value="">Sin series configuradas</option>';
    }

    function actualizarHintTipoDocumento() {
      const tipo = document.getElementById('tipo_documento').value;
      document.getElementById('tipo-documento-hint').textContent = TIPOS_DOC_HINT[tipo] || '';
    }

    const TEXTO_BOTON = {
      FACTURA: 'Emitir Factura', BOLETA: 'Emitir Boleta',
      NOTA_VENTA: 'Registrar Nota de Venta', COTIZACION: 'Registrar Cotización',
    };

    function actualizarTextoBoton() {
      const tipo = document.getElementById('tipo_documento').value;
      document.getElementById('btn-guardar').innerHTML =
        `<i class="bi bi-check-lg me-2"></i>${TEXTO_BOTON[tipo] || 'Guardar'}`;
    }

    document.getElementById('tipo_documento').addEventListener('change', () => {
      actualizarSeriesDisponibles();
      actualizarHintTipoDocumento();
      actualizarTextoBoton();
    });

    // ==================== CLIENTE ====================
    let timerCliente = null;
    document.getElementById('cliente-search').addEventListener('input', (e) => {
      clearTimeout(timerCliente);
      const q = e.target.value.trim();
      if (q.length < 2) { document.getElementById('cliente-resultados').style.display = 'none'; return; }
      timerCliente = setTimeout(() => buscarCliente(q), 350);
    });

    async function buscarCliente(q) {
      try {
        const res = await clientesApi.listar({ search: q, limit: 8 });
        const clientes = Array.isArray(res.data) ? res.data : res.data?.clientes || [];
        const cont = document.getElementById('cliente-resultados');
        cont.style.display = clientes.length ? 'block' : 'none';
        cont.innerHTML = clientes.map((c) => `
          <button type="button" class="list-group-item list-group-item-action" data-id="${c.id}" data-nombre="${c.razon_social}" data-doc="${c.numero_documento}">
            <strong>${c.razon_social}</strong> <span class="text-muted small">${c.numero_documento}</span>
          </button>`).join('');
        cont.querySelectorAll('button').forEach((btn) => {
          btn.addEventListener('click', () => seleccionarCliente({ id: btn.dataset.id, razon_social: btn.dataset.nombre, numero_documento: btn.dataset.doc }));
        });
      } catch (_) { }
    }

    function seleccionarCliente(c) {
      estado.cliente = c;
      document.getElementById('id_cliente').value = c.id;
      document.getElementById('cliente-search').value = c.razon_social;
      document.getElementById('cliente-seleccionado').textContent = `✓ ${c.razon_social} (${c.numero_documento})`;
      document.getElementById('cliente-resultados').style.display = 'none';
    }

    document.getElementById('btn-cliente-generico').addEventListener('click', async () => {
      try {
        const res = await clientesApi.listar({ search: 'Clientes varios', limit: 1 });
        const arr = Array.isArray(res.data) ? res.data : res.data?.clientes || [];
        if (arr.length) seleccionarCliente(arr[0]);
        else toast('No se encontró cliente genérico en el sistema', 'warning');
      } catch (err) { toastError(err); }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#cliente-search') && !e.target.closest('#cliente-resultados')) {
        document.getElementById('cliente-resultados').style.display = 'none';
      }
    });

    // ==================== NUEVO CLIENTE (consulta SUNAT/RENIEC) ====================
    const modalClienteNuevo = new bootstrap.Modal('#modal-cliente-nuevo');

    document.getElementById('btn-cliente-nuevo').addEventListener('click', () => {
      ['nc-documento', 'nc-razon', 'nc-telefono', 'nc-direccion'].forEach((id) => document.getElementById(id).value = '');
      document.getElementById('nc-tipo').value = 'DNI';
      modalClienteNuevo.show();
      setTimeout(() => document.getElementById('nc-documento').focus(), 200);
    });

    document.getElementById('btn-nc-consultar').addEventListener('click', async () => {
      const tipo = document.getElementById('nc-tipo').value;
      const num = document.getElementById('nc-documento').value.trim();
      if (!num) { toast('Ingrese el número de documento', 'warning'); return; }
      if (tipo !== 'DNI' && tipo !== 'RUC') { toast('Solo se puede consultar DNI o RUC', 'warning'); return; }
      try {
        const res = await clientesApi.consultarDocumento(tipo.toLowerCase(), num);
        const d = res.data || res;
        document.getElementById('nc-razon').value = d.razon_social || d.nombre_completo || '';
        document.getElementById('nc-direccion').value = d.direccion || '';
        toast('Datos obtenidos correctamente', 'success');
      } catch (err) { toastError(err); }
    });

    document.getElementById('btn-nc-guardar').addEventListener('click', async () => {
      const dto = {
        tipo_documento: document.getElementById('nc-tipo').value,
        numero_documento: document.getElementById('nc-documento').value.trim(),
        razon_social: document.getElementById('nc-razon').value.trim(),
        telefono: document.getElementById('nc-telefono').value.trim() || undefined,
        direccion: document.getElementById('nc-direccion').value.trim() || undefined,
      };
      if (!dto.numero_documento || !dto.razon_social) {
        toast('Complete número de documento y nombre/razón social', 'warning');
        return;
      }
      try {
        const res = await clientesApi.crear(dto);
        const nuevo = res.data || res;
        seleccionarCliente(nuevo);
        modalClienteNuevo.hide();
        toast('Cliente creado y seleccionado', 'success');
      } catch (err) { toastError(err); }
    });

    // ==================== PRODUCTOS (fila de entrada, 100% teclado) ====================
    // Flujo: escribir código/nombre → Enter (resuelve o abre sugerencias) →
    // Enter en cantidad → Enter en precio confirma la línea y deja la fila
    // lista para el siguiente producto. Sin modales de por medio.
    const inpCodigo = document.getElementById('entrada-codigo');
    const contSugerencias = document.getElementById('entrada-sugerencias');
    const inpCantidadEntrada = document.getElementById('entrada-cantidad');
    const selPrecioEntrada = document.getElementById('entrada-precio');
    const spanTotalEntrada = document.getElementById('entrada-total');
    const spanNombreEntrada = document.getElementById('entrada-nombre');

    let productoEntrada = null;
    let sugerencias = [];
    let sugerenciaActiva = -1;
    let timerEntradaProducto = null;

    function ocultarSugerencias() {
      contSugerencias.style.display = 'none';
      contSugerencias.innerHTML = '';
      sugerencias = [];
      sugerenciaActiva = -1;
    }

    function renderSugerencias() {
      if (!sugerencias.length) { ocultarSugerencias(); return; }
      contSugerencias.style.display = 'block';
      contSugerencias.innerHTML = sugerencias.map((p, i) => `
        <button type="button" class="list-group-item list-group-item-action py-1 ${i === sugerenciaActiva ? 'active' : ''}" data-idx="${i}">
          <div><span class="text-muted small">${p.codigo}</span> ${p.nombre}</div>
          <div class="small ${i === sugerenciaActiva ? '' : 'text-muted'}">Stock: ${Number(p.stock_actual || 0).toFixed(0)}</div>
        </button>`).join('');
      contSugerencias.querySelectorAll('button').forEach((btn) => {
        // mousedown (no click): dispara antes que el blur del input, así no se cierra antes de leer el dato
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          seleccionarProductoEntrada(sugerencias[+btn.dataset.idx]);
        });
      });
    }

    async function buscarSugerenciasProducto(q) {
      try {
        const res = await productosApi.listar({ search: q, limit: 8 });
        sugerencias = Array.isArray(res.data) ? res.data : res.data?.productos || [];
        sugerenciaActiva = -1;
        renderSugerencias();
      } catch (_) { /* búsqueda silenciosa mientras se escribe */ }
    }

    function resetEntradaProducto() {
      productoEntrada = null;
      spanNombreEntrada.textContent = '—';
      selPrecioEntrada.innerHTML = '';
      inpCantidadEntrada.value = 1;
      inpCantidadEntrada.disabled = true;
      selPrecioEntrada.disabled = true;
      spanTotalEntrada.textContent = '—';
    }

    function actualizarTotalEntrada() {
      if (!productoEntrada) { spanTotalEntrada.textContent = '—'; return; }
      const cant = Math.max(1, parseInt(inpCantidadEntrada.value, 10) || 1);
      const tipo = +selPrecioEntrada.value;
      const precio = Number(productoEntrada[`precio_venta_${tipo}`] || productoEntrada.precio_venta_1);
      spanTotalEntrada.textContent = formatMoneda(cant * precio);
    }

    function seleccionarProductoEntrada(producto) {
      productoEntrada = producto;
      inpCodigo.value = producto.codigo;
      spanNombreEntrada.textContent = producto.nombre;
      ocultarSugerencias();

      selPrecioEntrada.innerHTML = [1, 2, 3, 4, 5].map((n) => {
        const val = producto[`precio_venta_${n}`];
        return val && Number(val) > 0 ? `<option value="${n}">P${n}: ${formatMoneda(val)}</option>` : '';
      }).join('');

      inpCantidadEntrada.disabled = false;
      selPrecioEntrada.disabled = false;
      inpCantidadEntrada.value = 1;
      actualizarTotalEntrada();

      inpCantidadEntrada.focus();
      inpCantidadEntrada.select();
    }

    function confirmarFilaEntrada() {
      if (!productoEntrada) return;
      const cantidad = Math.max(1, parseInt(inpCantidadEntrada.value, 10) || 1);
      const precio_tipo = +selPrecioEntrada.value;
      const precio = Number(productoEntrada[`precio_venta_${precio_tipo}`] || productoEntrada.precio_venta_1);

      // Misma línea (producto + tipo de precio) ya en la venta → suma cantidad
      // en vez de duplicar la fila.
      const existente = estado.items.find((i) => i.producto.id === productoEntrada.id && i.precio_tipo === precio_tipo);
      if (existente) {
        existente.cantidad += cantidad;
      } else {
        estado.items.push({ producto: productoEntrada, cantidad, precio_tipo, precio });
      }
      renderItems();

      inpCodigo.value = '';
      resetEntradaProducto();
      inpCodigo.focus();
    }

    inpCodigo.addEventListener('input', () => {
      clearTimeout(timerEntradaProducto);
      if (productoEntrada) resetEntradaProducto(); // re-escribiendo: invalida la selección previa
      const q = inpCodigo.value.trim();
      if (!q) { ocultarSugerencias(); return; }
      timerEntradaProducto = setTimeout(() => buscarSugerenciasProducto(q), 200);
    });

    inpCodigo.addEventListener('keydown', async (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!sugerencias.length) return;
        sugerenciaActiva = (sugerenciaActiva + 1) % sugerencias.length;
        renderSugerencias();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (!sugerencias.length) return;
        sugerenciaActiva = (sugerenciaActiva - 1 + sugerencias.length) % sugerencias.length;
        renderSugerencias();
      } else if (e.key === 'Escape') {
        ocultarSugerencias();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (sugerenciaActiva >= 0 && sugerencias[sugerenciaActiva]) {
          seleccionarProductoEntrada(sugerencias[sugerenciaActiva]);
          return;
        }
        const q = inpCodigo.value.trim();
        if (!q) return;
        clearTimeout(timerEntradaProducto);
        try {
          const res = await productosApi.listar({ search: q, limit: 8 });
          const prods = Array.isArray(res.data) ? res.data : res.data?.productos || [];
          const exacto = prods.find((p) => p.codigo?.toLowerCase() === q.toLowerCase());
          if (exacto) { seleccionarProductoEntrada(exacto); return; }
          if (prods.length === 1) { seleccionarProductoEntrada(prods[0]); return; }
          if (prods.length > 1) { sugerencias = prods; sugerenciaActiva = 0; renderSugerencias(); return; }
          toast('Producto no encontrado', 'warning');
        } catch (err) { toastError(err); }
      }
    });

    inpCantidadEntrada.addEventListener('input', actualizarTotalEntrada);
    inpCantidadEntrada.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); selPrecioEntrada.focus(); }
    });

    selPrecioEntrada.addEventListener('change', actualizarTotalEntrada);
    selPrecioEntrada.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); confirmarFilaEntrada(); }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#entrada-codigo') && !e.target.closest('#entrada-sugerencias')) {
        ocultarSugerencias();
      }
    });

    function renderItems() {
      const tbody = document.getElementById('filas-productos');
      const filaEntrada = document.getElementById('fila-entrada');
      tbody.querySelectorAll('tr:not(#fila-entrada)').forEach((tr) => tr.remove());

      estado.items.forEach((item, idx) => {
        const tr = document.createElement('tr');
        const precios = [1, 2, 3, 4, 5].map((n) => {
          const val = item.producto[`precio_venta_${n}`];
          return val && Number(val) > 0 ? `<option value="${n}" ${item.precio_tipo === n ? 'selected' : ''}>P${n}: ${formatMoneda(val)}</option>` : '';
        }).join('');
        tr.innerHTML = `
          <td class="small text-muted">${item.producto.codigo}</td>
          <td>${item.producto.nombre}</td>
          <td><input type="number" class="form-control form-control-sm text-end inp-cantidad" data-idx="${idx}" value="${item.cantidad}" min="1" step="1"></td>
          <td><select class="form-select form-select-sm sel-precio-tipo" data-idx="${idx}">${precios}</select></td>
          <td class="text-end fw-semibold total-item" data-idx="${idx}">${formatMoneda(calcularTotalItem(item))}</td>
          <td><button type="button" class="btn btn-sm btn-outline-danger btn-quitar" data-idx="${idx}"><i class="bi bi-trash"></i></button></td>`;
        tbody.insertBefore(tr, filaEntrada);
      });

      // Eventos
      tbody.querySelectorAll('.btn-quitar').forEach((btn) => {
        btn.addEventListener('click', () => {
          estado.items.splice(+btn.dataset.idx, 1);
          renderItems(); calcularTotales();
        });
      });
      tbody.querySelectorAll('.inp-cantidad').forEach((inp) => {
        inp.addEventListener('change', () => {
          estado.items[+inp.dataset.idx].cantidad = Math.max(1, parseInt(inp.value, 10) || 1);
          renderItems(); calcularTotales();
        });
      });
      tbody.querySelectorAll('.sel-precio-tipo').forEach((sel) => {
        sel.addEventListener('change', () => {
          const idx = +sel.dataset.idx;
          const tipo = +sel.value;
          estado.items[idx].precio_tipo = tipo;
          estado.items[idx].precio = Number(estado.items[idx].producto[`precio_venta_${tipo}`]);
          renderItems(); calcularTotales();
        });
      });
      calcularTotales();
    }

    function calcularTotalItem(item) {
      return item.cantidad * item.precio;
    }

    function calcularTotales() {
      const total = estado.items.reduce((s, i) => s + calcularTotalItem(i), 0);
      const igv = total - (total / 1.18);
      const subtotal = total / 1.18;
      document.getElementById('resumen-subtotal').textContent = formatMoneda(subtotal, 'PEN');
      document.getElementById('resumen-igv').textContent = formatMoneda(igv, 'PEN');
      document.getElementById('resumen-total').textContent = formatMoneda(total, 'PEN');
      actualizarPrimerPago(total);
    }

    // ==================== PAGOS ====================
    function agregarPago() {
      const metodos = estado.metodosPago;
      const opciones = metodos.map((m) => `<option value="${m.id}">${m.nombre}</option>`).join('');
      const idx = estado.pagos.length;
      estado.pagos.push({ id_metodo_pago: metodos[0]?.id || '', monto: 0 });

      const lista = document.getElementById('lista-pagos');
      const div = document.createElement('div');
      div.className = 'd-flex gap-2 align-items-center mb-2';
      div.setAttribute('data-pago-idx', idx);
      div.innerHTML = `
        <select class="form-select form-select-sm sel-metodo" data-idx="${idx}">${opciones}</select>
        <input type="number" class="form-control form-control-sm inp-monto" data-idx="${idx}" value="0" min="0" step="0.01" style="width:100px">
        ${idx > 0 ? `<button type="button" class="btn btn-sm btn-outline-danger btn-quitar-pago" data-idx="${idx}"><i class="bi bi-x"></i></button>` : ''}`;
      lista.appendChild(div);

      lista.querySelectorAll('.sel-metodo, .inp-monto').forEach((el) => {
        el.addEventListener('change', () => {
          const i = +el.dataset.idx;
          if (el.classList.contains('sel-metodo')) estado.pagos[i].id_metodo_pago = el.value;
          if (el.classList.contains('inp-monto')) estado.pagos[i].monto = parseFloat(el.value) || 0;
          actualizarTotalPagado();
        });
      });

      lista.querySelectorAll('.btn-quitar-pago').forEach((btn) => {
        btn.addEventListener('click', () => {
          estado.pagos.splice(+btn.dataset.idx, 1);
          btn.closest('[data-pago-idx]').remove();
          actualizarTotalPagado();
        });
      });
    }

    function actualizarPrimerPago(total) {
      const inp = document.querySelector('.inp-monto[data-idx="0"]');
      if (inp && estado.pagos.length === 1) {
        inp.value = total.toFixed(2);
        estado.pagos[0].monto = total;
        actualizarTotalPagado();
      }
    }

    function actualizarTotalPagado() {
      const total = estado.pagos.reduce((s, p) => s + (p.monto || 0), 0);
      document.getElementById('total-pagado').textContent = formatMoneda(total);
    }

    document.getElementById('btn-agregar-pago').addEventListener('click', () => {
      if (estado.pagos.length >= 3) { toast('Máximo 3 métodos de pago', 'warning'); return; }
      agregarPago();
    });

    // Deja el formulario listo para la siguiente venta, sin salir de la pantalla
    // (las ventas son rápidas y seguidas: no tiene sentido volver al listado cada vez).
    function resetearFormulario() {
      estado.items = [];
      renderItems();

      inpCodigo.value = '';
      resetEntradaProducto();
      ocultarSugerencias();

      estado.pagos = [];
      document.getElementById('lista-pagos').innerHTML = '';
      agregarPago();

      estado.cliente = null;
      document.getElementById('id_cliente').value = '';
      document.getElementById('cliente-search').value = '';
      document.getElementById('cliente-seleccionado').textContent = '';

      document.getElementById('observaciones').value = '';
      document.getElementById('detalles-extra').classList.add('d-none');
      document.getElementById('btn-toggle-detalles').querySelector('i').className = 'bi bi-chevron-down me-1';

      document.getElementById('tipo_documento').value = 'BOLETA';
      actualizarSeriesDisponibles();
      actualizarHintTipoDocumento();

      calcularTotales();

      const btn = document.getElementById('btn-guardar');
      btn.disabled = false;
      actualizarTextoBoton();

      document.getElementById('cliente-search').focus();
    }

    // ==================== GUARDAR ====================
    document.getElementById('form-venta').addEventListener('submit', async (e) => {
      e.preventDefault();

      const tipoDocumento = document.getElementById('tipo_documento').value;
      const esOficial = tipoDocumento === 'FACTURA' || tipoDocumento === 'BOLETA';
      const idSerie = document.getElementById('id_serie_documento').value;

      if (!document.getElementById('id_cliente').value) {
        toast('Seleccione un cliente', 'warning'); return;
      }
      if (!idSerie) {
        toast('No hay una serie configurada para este tipo de documento. Configúrela en Configuración → Series.', 'warning'); return;
      }
      if (estado.items.length === 0) {
        toast('Agregue al menos un producto', 'warning'); return;
      }

      const detalle = estado.items.map((item) => ({
        id_producto: item.producto.id,
        cantidad: item.cantidad,
        precio_tipo: item.precio_tipo,
      }));

      const pagos = estado.pagos
        .filter((p) => p.monto > 0 && p.id_metodo_pago)
        .map((p) => ({ id_metodo_pago: p.id_metodo_pago, monto: p.monto }));

      const totalPagado = pagos.reduce((s, p) => s + p.monto, 0);
      const totalVenta = estado.items.reduce((s, i) => s + calcularTotalItem(i), 0);
      if (esOficial && totalPagado + 0.01 < totalVenta) {
        toast(`${tipoDocumento === 'FACTURA' ? 'La factura' : 'La boleta'} requiere el pago completo (falta S/ ${(totalVenta - totalPagado).toFixed(2)})`, 'warning');
        return;
      }

      const btn = document.getElementById('btn-guardar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Procesando...';

      try {
        const dto = {
          tipo_documento: tipoDocumento,
          id_serie_documento: idSerie,
          id_cliente: document.getElementById('id_cliente').value,
          moneda: 'PEN',
          observaciones: document.getElementById('observaciones').value || undefined,
          id_caja_apertura: document.getElementById('id_caja_apertura').value || undefined,
          detalle,
          pagos: pagos.length ? pagos : undefined,
        };

        const res = await ventasApi.crear(dto);
        const ventaCreada = res.data || res;

        const esOficial = ventaCreada.tipo_documento === 'FACTURA' || ventaCreada.tipo_documento === 'BOLETA';
        toast(
          esOficial
            ? '¡Documento emitido! Recuerda enviarlo a SUNAT desde "Facturación → Enviar a SUNAT".'
            : '¡Documento emitido correctamente!',
          'success',
          esOficial ? 5000 : 3500,
        );
        window.open(`/src/pages/ventas/imprimir.html?id=${ventaCreada.id}`, '_blank');
        resetearFormulario();
      } catch (err) {
        toastError(err);
        btn.disabled = false;
        actualizarTextoBoton();
      }
    });

    init();
  </script>
</body>
</html>
