<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRHH — ERP Daytona</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

  <div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0"><i class="bi bi-person-badge me-2 text-primary"></i>Personal</h5>
      <button class="btn btn-primary" id="btn-nuevo"><i class="bi bi-plus-lg me-1"></i>Nuevo Personal</button>
    </div>

    <div class="card mb-3">
      <div class="card-body py-2">
        <div class="row g-2">
          <div class="col-sm-5">
            <input type="text" class="form-control form-control-sm" id="f-search" placeholder="Buscar por DNI, nombres o área...">
          </div>
          <div class="col-sm-3">
            <select class="form-select form-select-sm" id="f-estado">
              <option value="">Todos</option>
              <option value="activo">Activos</option>
              <option value="cesado">Cesados</option>
            </select>
          </div>
          <div class="col-sm-2">
            <button class="btn btn-primary btn-sm w-100" id="btn-buscar"><i class="bi bi-search me-1"></i>Buscar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-sm mb-0">
            <thead class="table-light">
              <tr>
                <th>DNI</th>
                <th>Apellidos y Nombres</th>
                <th>Cargo</th>
                <th>Área</th>
                <th>Tipo contrato</th>
                <th class="text-end">Sueldo</th>
                <th>Ingreso</th>
                <th class="text-center">Estado</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-personal">
              <tr><td colspan="9" class="text-center py-4 text-muted">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer d-flex justify-content-between">
        <span class="text-muted small" id="info-res">-</span>
        <div id="paginacion"></div>
      </div>
    </div>
  </div>

  <!-- Modal personal -->
  <div class="modal fade" id="modal-personal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-titulo">Nuevo Personal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">DNI <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="p-dni" maxlength="8">
            </div>
            <div class="col-md-4">
              <label class="form-label">Nombres <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="p-nombres">
            </div>
            <div class="col-md-4">
              <label class="form-label">Apellidos <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="p-apellidos">
            </div>
            <div class="col-md-4">
              <label class="form-label">Cargo</label>
              <input type="text" class="form-control" id="p-cargo">
            </div>
            <div class="col-md-4">
              <label class="form-label">Área</label>
              <input type="text" class="form-control" id="p-area">
            </div>
            <div class="col-md-4">
              <label class="form-label">Tipo contrato</label>
              <select class="form-select" id="p-contrato">
                <option value="indefinido">Indefinido</option>
                <option value="plazo_fijo">Plazo fijo</option>
                <option value="tiempo_parcial">Tiempo parcial</option>
                <option value="practicante">Practicante</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Fecha ingreso <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="p-ingreso">
            </div>
            <div class="col-md-4">
              <label class="form-label">Sueldo (S/) <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="p-sueldo" min="0" step="0.01">
            </div>
            <div class="col-md-4">
              <label class="form-label">Banco</label>
              <select class="form-select" id="p-banco">
                <option value="">Sin cuenta</option>
                <option value="BCP">BCP</option>
                <option value="BBVA">BBVA</option>
                <option value="Interbank">Interbank</option>
                <option value="Scotiabank">Scotiabank</option>
                <option value="BanBif">BanBif</option>
                <option value="Otro">Otro</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Cuenta bancaria</label>
              <input type="text" class="form-control" id="p-cuenta">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="btn-guardar-personal">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initLayout } from '/src/components/layout.js';
    import { api } from '/src/api/client.js';
    import { rrhhApi } from '/src/api/modules.js';
    import { formatMoneda, formatFecha, renderPaginacion } from '/src/components/tabla.js';
    import { toast, toastError } from '/src/components/toast.js';
    import { confirmar } from '/src/components/modal.js';
    import { logout } from '/src/auth/auth.js';

    if (!api.getToken()) window.location.href = '/src/pages/login.html';
    initLayout('rrhh');
    document.getElementById('btn-logout').addEventListener('click', () => logout());

    let paginaActual = 1, personaEditando = null;
    const LIMIT = 20;

    async function cargar(page = 1) {
      paginaActual = page;
      const tbody = document.getElementById('tabla-personal');
      tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4"><span class="spinner-border spinner-border-sm"></span></td></tr>';
      try {
        const res = await rrhhApi.listar({ search: document.getElementById('f-search').value || undefined, estado: document.getElementById('f-estado').value || undefined, page, limit: LIMIT });
        const items = Array.isArray(res.data) ? res.data : res.data?.personal || [];
        const total = res.data?.total ?? items.length;
        document.getElementById('info-res').textContent = `${total} registros`;

        tbody.innerHTML = items.length ? items.map((p) => `
          <tr>
            <td class="fw-semibold">${p.dni}</td>
            <td>${p.apellidos}, ${p.nombres}</td>
            <td class="small">${p.cargo || '-'}</td>
            <td class="small">${p.area || '-'}</td>
            <td class="small"><span class="badge bg-light text-dark border">${p.tipo_contrato || '-'}</span></td>
            <td class="text-end fw-semibold">${formatMoneda(p.sueldo)}</td>
            <td class="small">${formatFecha(p.fecha_ingreso)}</td>
            <td class="text-center">
              <span class="badge ${p.estado === 'activo' ? 'bg-success' : 'bg-secondary'}">${p.estado || 'activo'}</span>
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary me-1 btn-editar" data-id="${p.id}"><i class="bi bi-pencil"></i></button>
              ${!p.fecha_cese ? `<button class="btn btn-sm btn-outline-warning btn-cesar" data-id="${p.id}" data-nombre="${p.nombres} ${p.apellidos}" title="Cesar"><i class="bi bi-calendar-x"></i></button>` : ''}
            </td>
          </tr>`).join('') : '<tr><td colspan="9" class="text-center text-muted py-4">Sin resultados</td></tr>';

        renderPaginacion(document.getElementById('paginacion'), { page, total, limit: LIMIT }, cargar);
        tbody.querySelectorAll('.btn-editar').forEach((b) => b.addEventListener('click', () => abrirEditar(b.dataset.id)));
        tbody.querySelectorAll('.btn-cesar').forEach((b) => b.addEventListener('click', () => cesar(b.dataset.id, b.dataset.nombre)));
      } catch (err) { toastError(err); }
    }

    function abrirNuevo() {
      personaEditando = null;
      document.getElementById('modal-titulo').textContent = 'Nuevo Personal';
      ['p-dni','p-nombres','p-apellidos','p-cargo','p-area','p-cuenta'].forEach((id) => document.getElementById(id).value = '');
      document.getElementById('p-contrato').value = 'indefinido';
      document.getElementById('p-banco').value = '';
      document.getElementById('p-ingreso').value = new Date().toISOString().split('T')[0];
      document.getElementById('p-sueldo').value = '';
      new bootstrap.Modal(document.getElementById('modal-personal')).show();
    }

    async function abrirEditar(id) {
      try {
        const res = await rrhhApi.obtener(id);
        const p = res.data || res;
        personaEditando = p;
        document.getElementById('modal-titulo').textContent = 'Editar Personal';
        document.getElementById('p-dni').value = p.dni;
        document.getElementById('p-nombres').value = p.nombres;
        document.getElementById('p-apellidos').value = p.apellidos;
        document.getElementById('p-cargo').value = p.cargo || '';
        document.getElementById('p-area').value = p.area || '';
        document.getElementById('p-contrato').value = p.tipo_contrato || 'indefinido';
        document.getElementById('p-ingreso').value = p.fecha_ingreso?.split('T')[0] || '';
        document.getElementById('p-sueldo').value = p.sueldo;
        document.getElementById('p-banco').value = p.banco || '';
        document.getElementById('p-cuenta').value = p.cuenta_bancaria || '';
        new bootstrap.Modal(document.getElementById('modal-personal')).show();
      } catch (err) { toastError(err); }
    }

    async function cesar(id, nombre) {
      const fecha = prompt(`Fecha de cese para ${nombre} (YYYY-MM-DD):`);
      if (!fecha) return;
      const ok = await confirmar(`¿Cesar a ${nombre} el ${fecha}?`, 'Cese de Personal');
      if (!ok) return;
      try {
        await rrhhApi.cesar(id, fecha);
        toast('Personal cesado');
        cargar(paginaActual);
      } catch (err) { toastError(err); }
    }

    document.getElementById('btn-guardar-personal').addEventListener('click', async () => {
      const dto = {
        dni: document.getElementById('p-dni').value.trim(),
        nombres: document.getElementById('p-nombres').value.trim(),
        apellidos: document.getElementById('p-apellidos').value.trim(),
        cargo: document.getElementById('p-cargo').value.trim() || undefined,
        area: document.getElementById('p-area').value.trim() || undefined,
        tipo_contrato: document.getElementById('p-contrato').value,
        fecha_ingreso: document.getElementById('p-ingreso').value,
        sueldo: parseFloat(document.getElementById('p-sueldo').value) || 0,
        banco: document.getElementById('p-banco').value || undefined,
        cuenta_bancaria: document.getElementById('p-cuenta').value.trim() || undefined,
      };
      if (!dto.dni || !dto.nombres || !dto.apellidos || !dto.fecha_ingreso) {
        toast('Complete los campos obligatorios', 'warning'); return;
      }
      try {
        if (personaEditando) await rrhhApi.actualizar(personaEditando.id, dto);
        else await rrhhApi.crear(dto);
        toast(personaEditando ? 'Personal actualizado' : 'Personal registrado');
        bootstrap.Modal.getInstance(document.getElementById('modal-personal')).hide();
        cargar(paginaActual);
      } catch (err) { toastError(err); }
    });

    document.getElementById('btn-nuevo').addEventListener('click', abrirNuevo);
    document.getElementById('btn-buscar').addEventListener('click', () => cargar(1));
    document.getElementById('f-search').addEventListener('keypress', (e) => { if (e.key === 'Enter') cargar(1); });
    cargar();
  </script>
</body>
</html>
